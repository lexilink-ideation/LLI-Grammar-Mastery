<header class="topbar">
  <div class="shell">
    <button class="brand" data-act="home" aria-label="LLI Lexilink Ideation — back to all points"><b>LLI</b><i></i><span>Lexilink Ideation</span></button>
    <span class="lvl-chip" id="lvlChip"></span>
    <div class="grow"></div>
    <button class="tool" id="sizeBtn" data-act="size" title="Change question text size">Text size: M</button>
    <button class="tool fs" data-act="full" title="Full screen for projecting">Full screen</button>
  </div>
</header>
<main id="app"></main>

<script>
const L = {"code":"A2","name":"Waystage","next":"B1","units":[{"n":"Telling stories about the past","p":[{"t":"Past simple in short narratives","c":"I can tell a short story about a past event in the right order.","ex":"Last summer we went to Rome. We visited the Colosseum.","w":"","r":"Tell events in order with the past simple. Keep the same tense through the story: we went…, we saw…, we bought…","tip":"Show four picture prompts. Pairs tell the story in the past simple, then retell it to another pair.","q":[["g","Last summer we ___ to Rome and visited the Colosseum.",["went","go","have gone"],"A finished time (last summer) → past simple."],["g","We arrived at the hotel and ___ our bags.",["unpacked","unpack","unpacking"],"Keep the same tense: arrived … unpacked."],["g","First I opened the box. Then I ___ a little puppy inside!",["found","find","finded"],"find → found."],["g","She ___ her keys, so she couldn't open the door.",["lost","loses","losed"],"lose → lost."],["g","What ___ next? — The police arrived.",["happened","did happen","happens"],"What is the subject here, so no did: What happened?"],["c",["He woke up, got dressed and ran to school.","He woke up, gets dressed and ran to school.","He wake up, got dressed and ran to school."],"Keep every verb in the past."],["e","Yesterday I went to the shop and *buy* some milk.","Yesterday I went to the shop and bought some milk.","Keep the same tense: went … bought."],["e","We *taked* lots of photos on holiday.","We took lots of photos on holiday.","take → took."],["o","Then we caught a taxi to the airport","."]],"s":[["Tell me about a great day you had. Use at least six past verbs.","Last Saturday I got up early and went to the beach with my family. We swam, ate seafood and watched the sunset."],["Tell the story of a problem you had (you lost something, missed a bus…).","Last week I lost my phone. I looked everywhere. Finally I found it in my mum's car."]]},{"t":"Past continuous","c":"I can describe background actions in progress in the past.","ex":"At 8 pm I was cooking dinner.","w":"","r":"was / were + verb-ing for an action in progress at a time in the past: At 8 pm I was cooking.","tip":"Ask around the class: \"What were you doing at 7 o'clock last night?\" Then students ask each other about other times.","q":[["g","At 9 pm last night I ___ TV.",["was watching","watched","were watching"],"In progress at 9 pm → was watching."],["g","What ___ you doing at 6 this morning?",["were","was","did"]],["g","They ___ playing football at 4 o'clock.",["were","was","are"]],["g","It ___ raining when I left the house.",["was","were","did"]],["g","We weren't ___ to music. We were studying.",["listening","listen","listened"]],["c",["She was sleeping at midnight.","She sleeping at midnight.","She was sleep at midnight."]],["e","My parents *was* having dinner at eight.","My parents were having dinner at eight.","they → were."],["o","What were you doing at ten o'clock","?"]],"s":[["Say what you were doing yesterday at 7 am, 12 pm, 6 pm and 10 pm.","At 7 am I was having breakfast. At 12 I was eating lunch. At 6 I was doing homework. At 10 I was sleeping."],["Describe a busy place you remember. What were people doing?","Everyone was shopping. Children were playing. A man was selling ice cream."]]},{"t":"Past simple vs past continuous (when / while)","c":"I can show that one action interrupted another.","ex":"I was walking home when it started to rain.","w":"While I walked, I was seeing … → While I was walking, I saw …","r":"Long background action → past continuous. Short action that interrupts → past simple. when + short action; while + long action.","tip":"Draw a long wavy line (I was walking) and a lightning bolt (it started to rain). Students make sentences from picture pairs.","q":[["g","I was walking home when it ___ to rain.",["started","was starting","starts"],"The short action that interrupts → past simple."],["g","While she ___, the phone rang.",["was cooking","cooked","cooks"],"while + the long action → past continuous."],["g","He ___ off his bike while he was riding to school.",["fell","was falling","falls"],"The short action → past simple."],["g","When the teacher came in, we ___. We stopped immediately!",["were talking","talked","talk"],"Talking was already in progress → past continuous."],["c",["I was taking a shower when the lights went out.","I took a shower when the lights were going out.","I was taking a shower when the lights were go out."]],["c",["While I was waiting for the bus, I saw an old friend.","While I waited for the bus, I was seeing an old friend.","While I was waiting for the bus, I was see an old friend."]],["e","I *was_seeing* an accident while I was driving.","I saw an accident while I was driving.","The short action → past simple."],["o","What were you doing when I called","?"]],"s":[["Finish these: I was walking in the park when… / While I was sleeping…","I was walking in the park when I saw a dog in the lake. While I was sleeping, my brother ate my cake."],["Tell a short story about a surprise. What were you doing when it happened?","I was doing my homework when my dad came home with a kitten."]]},{"t":"Used to for past habits and states","c":"I can talk about things that were true in the past but are not now.","ex":"I used to live in Shanghai.","w":"I use to play → I used to play.","r":"used to + base verb for past habits and states that aren't true now: I used to live in Shanghai. Negative: didn't use to. Question: Did you use to…?","tip":"\"Then and now\": students make pairs of sentences — \"I used to…, but now I…\".","q":[["g","I ___ live in a small village. Now I live in a city.",["used to","use to","was used to"]],["g","Did you ___ play with toy cars?",["use to","used to","using to"],"After did → use to (no -d)."],["g","She ___ like vegetables, but now she loves them.",["didn't use to","didn't used to","not used to"],"After didn't → use to (no -d)."],["g","My grandpa used to ___ a bus driver.",["be","being","was"],"used to + base verb."],["c",["We used to go fishing every summer.","We use to go fishing every summer.","We used to going fishing every summer."]],["e","When I was young I *use* to hate school.","When I was young I used to hate school.","Positive sentences: used to."],["e","There used to *was* a cinema here.","There used to be a cinema here.","used to + base verb."],["o","Did you use to have long hair","?"]],"s":[["Tell me three things you used to do as a small child that you don't do now.","I used to cry a lot. I used to have a teddy bear. I didn't use to like reading."],["How has your town changed? Use used to and didn't use to.","There used to be a market here. There didn't use to be so many cars."]]},{"t":"Sequencers and ago","c":"I can order events with first, then, after that, finally and say how long ago.","ex":"I left school two years ago.","w":"before two years → two years ago.","r":"Order events with First, Then, After that, Next, Finally. ago goes after the time phrase: two years ago (with the past simple).","tip":"Students write how to make tea or their morning routine in five steps with sequencers, then read it to a partner.","q":[["g","I started school six years ___.",["ago","before","after"],"Time phrase + ago."],["g","___, open the box. Then take out the phone.",["First","Finally","After"]],["g","We had dinner. After ___, we watched a film.",["that","then","finally"],"Fixed phrase: after that."],["g","We waited for hours. ___ the bus arrived at midnight.",["Finally","First","Ago"]],["c",["She left ten minutes ago.","She left before ten minutes.","She left ago ten minutes."]],["c",["I met him three years ago.","I have met him three years ago.","I met him since three years."],"ago → past simple."],["e","We moved here *before* two years.","We moved here two years ago.","Use time phrase + ago."],["o","I came to this school two years ago",".","",["Two years ago I came to this school"]]],"s":[["Tell me how you get ready for school, in order: first, then, after that, finally.","First I get up. Then I wash my face. After that I have breakfast. Finally I catch the bus."],["When did you…? start learning English, last see a film, last travel. Use ago.","I started English five years ago. I saw a film two days ago."]]}]},{"n":"Talking about the future","p":[{"t":"Be going to for plans and intentions","c":"I can talk about my plans.","ex":"I'm going to study medicine.","w":"I going to → I'm going to.","r":"am / is / are + going to + base verb for plans you have already decided: I'm going to study medicine.","tip":"Students write three secret plans for the holiday. Classmates guess them with \"Are you going to…?\"","q":[["g","I ___ going to visit my aunt this weekend.",["am","is","will"]],["g","What are you going to ___ after school?",["do","doing","does"],"going to + base verb."],["g","They ___ going to buy a new car.",["aren't","isn't","don't"]],["g","___ she going to come to the party?",["Is","Are","Does"]],["g","I'm going to ___ harder next year.",["study","studying","studied"]],["c",["We're going to have a barbecue on Saturday.","We going to have a barbecue on Saturday.","We're going to having a barbecue on Saturday."]],["e","My brother *going* to study in England.","My brother is going to study in England.","Don't forget am / is / are."],["o","What are you going to do tomorrow","?"]],"s":[["Tell me your plans for the next holiday in five sentences with going to.","I'm going to visit my grandparents. I'm going to read three books. I'm not going to get up early."],["Ask a partner about their plans for this evening and the weekend.","What are you going to do tonight? Are you going to see your friends on Saturday?"]]},{"t":"Be going to for predictions from evidence","c":"I can predict something based on what I can see now.","ex":"Look at those clouds — it's going to rain.","w":"","r":"Use going to for a prediction when you can see the evidence now: Look at those clouds — it's going to rain.","tip":"Show pictures (a man about to fall, dark clouds, a full glass at the edge of a table). Ask: \"What's going to happen?\"","q":[["g","Look at the sky! It ___ rain.",["is going to","will going to","goes to"],"You can see the clouds → going to."],["g","Be careful! You ___ fall!",["are going to","will going","go to"]],["g","She's driving too fast. She ___ crash.",["is going to","going to","is go to"]],["g","The score is 4–0 with five minutes left. They ___ win.",["are going to","are going","go to"]],["g","I feel terrible. I think I ___ be sick.",["am going to","go to","going"]],["c",["The baby is going to cry. Look at her face!","The baby goes to cry. Look at her face!","The baby is going cry. Look at her face!"]],["e","Look! The glass *going* to fall!","Look! The glass is going to fall!","Don't forget is."],["o","I think it is going to snow","."]],"s":[["Predict what happens next: a boy running for a bus that is leaving, a man on a broken ladder, a black sky.","He's going to miss the bus. He's going to fall. It's going to rain."],["Look around you. What is going to happen in the next five minutes?","The bell is going to ring. Tom is going to yawn!"]]},{"t":"Present continuous for arrangements","c":"I can talk about fixed arrangements with times and places.","ex":"I'm meeting Sam on Friday at six.","w":"","r":"Use the present continuous for fixed future arrangements, usually with a time or place: I'm meeting Sam on Friday at six.","tip":"Students fill in a diary for next week, then try to find a free time to meet: \"I'm playing tennis on Tuesday.\"","q":[["g","I ___ the dentist tomorrow at 10.",["am seeing","see","saw"],"A fixed arrangement → present continuous."],["g","What ___ you doing on Saturday evening?",["are","do","will"]],["g","We ___ to Paris next month. We've got the tickets.",["are flying","fly","flew"]],["g","She ___ working tomorrow. It's her day off.",["isn't","doesn't","won't to"]],["g","Sorry, I can't come. I ___ dinner with my parents.",["am having","have","had"]],["c",["They're getting married in June.","They're get married in June.","They getting married in June."]],["e","I *meet* my friends tonight at 7. Do you want to come?","I'm meeting my friends tonight at 7. Do you want to come?","A fixed arrangement → present continuous."],["o","Are you doing anything this weekend","?"]],"s":[["Tell me your arrangements for this week, with times and places.","On Wednesday I'm having a piano lesson at 5. On Friday I'm meeting my cousins."],["Invite a partner out. They explain what they are doing instead.","— Can you come on Friday? — Sorry, I'm visiting my grandma."]]},{"t":"Will for decisions, offers and promises","c":"I can make spontaneous decisions, offers and promises.","ex":"The phone's ringing — I'll get it.","w":"","r":"will ('ll) for decisions made at the moment of speaking, offers (I'll help you) and promises (I won't tell anyone).","tip":"Say small problems (\"I'm cold\", \"This bag is heavy\"). Students reply with an offer: \"I'll close the window.\"","q":[["g","The phone's ringing. — I ___ get it.",["will","am going to","am"],"Deciding now → will."],["g","This box is heavy. — Wait, I ___ help you.",["will","am going to","help"],"An offer → will."],["g","I promise I ___ be late again.",["won't","don't","am not"],"A promise → will / won't."],["g","Which one do you want? — Hmm… I ___ have the blue one.",["will","am going","have"],"Deciding now → I'll."],["c",["Don't worry. I'll call you tonight.","Don't worry. I call you tonight.","Don't worry. I'll calling you tonight."]],["c",["I'm thirsty. — I'll get you some water.","I'm thirsty. — I get you some water.","I'm thirsty. — I'll to get you some water."]],["e","It's dark in here. I *turn* on the light.","It's dark in here. I'll turn on the light.","Deciding now → will."],["o","I will send you the photos tomorrow",".","",["Tomorrow I will send you the photos"]]],"s":[["Respond with an offer or a decision: \"I'm hungry.\" \"I left my pen at home.\" \"The door is open.\"","I'll make you a sandwich. I'll lend you mine. I'll close it."],["Make three promises to your teacher or parents.","I'll do my homework every day. I won't use my phone in class. I'll help with the dishes."]]},{"t":"Will for predictions; will vs going to","c":"I can make general predictions and choose between will and going to.","ex":"I think robots will do many jobs in the future.","w":"","r":"will for opinions and general predictions (I think…, probably). going to for plans already decided and predictions from evidence you can see.","tip":"Students write predictions for the class in 20 years with will, then their plans for next week with going to. Compare.","q":[["g","I think people ___ live on Mars one day.",["will","are going","won't to"],"Opinion / general prediction → will."],["g","I've bought the tickets. We ___ see the new film tonight.",["are going to","will","going to"],"A plan already decided → going to."],["g","Maybe it ___ be sunny tomorrow.",["will","is going","is"]],["g","I don't think she ___ pass the test. She never studies.",["will","is","does"]],["g","Look out! That car ___ hit the dog!",["is going to","will","goes to"],"You can see it now → going to."],["c",["I think robots will do many jobs in the future.","I think robots do many jobs in the future will.","I think robots will to do many jobs in the future."]],["e","I *will* visit my cousins next weekend. I've already booked the train.","I'm going to visit my cousins next weekend. I've already booked the train.","A plan already decided → going to."],["o","Do you think it will rain tomorrow","?"]],"s":[["Make five predictions about life in 2050.","Cars will fly. People won't use cash. Robots will cook our dinner."],["Tell me one plan for next year (going to) and one prediction (will).","I'm going to learn to swim. I think I'll be taller!"]]}]},{"n":"Present perfect","p":[{"t":"Present perfect for experience (ever / never)","c":"I can talk about life experiences without saying when.","ex":"Have you ever been to Japan? I've never tried sushi.","w":"Did you ever been …? → Have you ever been …?","r":"have / has + past participle for life experience with no exact time: Have you ever been to Japan? I've never tried sushi.","tip":"\"Find someone who…\": students ask Have you ever ridden a horse / eaten snails / met a famous person?","q":[["g","Have you ever ___ to Japan?",["been","went","go"],"have + past participle (been)."],["g","I've never ___ sushi.",["eaten","ate","eat"],"eat → ate → eaten."],["g","She ___ seen the sea.",["has never","never has","have never"]],["g","___ your parents ever visited London?",["Have","Has","Did"],"your parents = they → have."],["g","Has he ever ___ a horse?",["ridden","rode","ride"],"ride → rode → ridden."],["c",["I have met a famous actor.","I have meet a famous actor.","I has met a famous actor."]],["e","*Did* you ever been to Beijing?","Have you ever been to Beijing?","Life experience → Have you ever…?"],["o","Have you ever lost your phone","?"]],"s":[["Tell me three things you have done and two things you have never done.","I've been to Thailand. I've ridden a horse. I've never seen snow."],["Ask a partner five Have you ever…? questions, then report back.","Have you ever climbed a mountain? — Yes, I have. Lucy has climbed Mount Tai."]]},{"t":"Present perfect with just, already, yet","c":"I can talk about recent actions and things not done yet.","ex":"I've just finished. Have you done it yet?","w":"","r":"just = a very short time ago. already = sooner than expected. yet = in questions and negatives, at the end: Have you finished yet? I haven't finished yet.","tip":"Make a to-do list for a party and tick some items. Students say what has already been done and what hasn't been done yet.","q":[["g","Have you done your homework ___?",["yet","already","just"],"Question → yet, at the end."],["g","I've ___ finished my lunch. I'm full.",["just","yet","ever"]],["g","She hasn't called me ___.",["yet","already","just"],"Negative → yet."],["g","We've ___ seen this film. Let's watch something else.",["already","yet","ever"]],["c",["The train has just left.","The train has left just.","The train just has left."],"just goes between have and the participle."],["c",["I haven't packed my bag yet.","I haven't yet packed my bag yet.","I haven't packed yet my bag."],"yet goes at the end."],["e","I *yet* haven't seen it.","I haven't seen it yet.","yet goes at the end."],["o","Has the film started yet","?"]],"s":[["Think about today. What have you already done? What haven't you done yet?","I've already had breakfast. I haven't done my homework yet."],["Tell me some news with just.","I've just got a new phone! My aunt has just had a baby."]]},{"t":"Present perfect vs past simple","c":"I can use the past simple with a finished time and the present perfect without one.","ex":"I've seen that film. I saw it last week.","w":"I have seen him yesterday → I saw him yesterday.","r":"Past simple with a finished time (yesterday, in 2020, last week, ago). Present perfect with no time, or time up to now (ever, never, just, yet).","tip":"Start with the present perfect (Have you ever…?), then ask details in the past simple (When did you go? Who did you go with?).","q":[["g","I ___ him yesterday.",["saw","have seen","see"],"yesterday = finished time → past simple."],["g","Have you ever been to Spain? — Yes, I ___ there in 2022.",["went","have gone","have been"],"in 2022 = finished time → past simple."],["g","She ___ three books this month. (The month isn't finished.)",["has read","read","reads"],"Time up to now → present perfect."],["g","When ___ you arrive?",["did","have","has"],"When…? asks for a time → past simple."],["g","Oh no! I ___ my keys. I can't open the door.",["have lost","losed","lose"],"Result now, no time given → present perfect."],["c",["We moved here two years ago.","We have moved here two years ago.","We have move here two years ago."],"ago → past simple."],["e","I *have_seen* that film last week.","I saw that film last week.","last week = finished time → past simple."],["o","Have you ever eaten Indian food","?"]],"s":[["Tell me about a place you've been to. Then give details: when did you go and what did you do?","I've been to Xi'an. I went there last year and saw the Terracotta Warriors."],["Ask a partner one Have you ever…? question and three follow-up questions in the past simple.","Have you ever been camping? Where did you go? Who did you go with? Did you like it?"]]},{"t":"Present perfect with for and since","c":"I can say how long something has continued up to now.","ex":"I've lived here for three years / since 2023.","w":"since three years → for three years.","r":"for + a length of time (for three years). since + a starting point (since 2023, since Monday). Use with the present perfect: I've lived here for / since…","tip":"Draw a timeline: since = a point (a dot), for = a length (a bracket). Students sort time phrases into two groups.","q":[["g","I've lived here ___ 2019.",["since","for","from"],"2019 is a starting point → since."],["g","She's been a teacher ___ ten years.",["for","since","during"],"ten years is a length of time → for."],["g","How long ___ you known Lisa?",["have","did","are"]],["g","We've had this car ___ last summer.",["since","for","ago"]],["g","They have been married ___ a long time.",["for","since","during"]],["c",["I've known her since I was six.","I know her since I was six.","I've known her for I was six."],"Up to now → present perfect + since."],["e","I have studied English *since* five years.","I have studied English for five years.","Length of time → for."],["e","I *live* here since 2020.","I've lived here since 2020.","Up to now → present perfect."],["o","How long have you had your phone","?"]],"s":[["How long have you…? lived in your home, studied English, known your best friend, had your bag.","I've lived in my flat for six years. I've studied English since 2019."],["Interview a partner with How long have you…? and report back.","Mia has played the piano for four years. She's had her cat since 2022."]]}]},{"n":"Comparing and describing","p":[{"t":"Comparative adjectives","c":"I can compare two people, places or things.","ex":"Beijing is bigger than my hometown.","w":"more bigger → bigger.","r":"Short adjectives + -er (bigger, nicer, happier). Long adjectives: more + adjective (more expensive). Irregular: good→better, bad→worse, far→further. Use than.","tip":"Compare two cities, animals or phones. Students make as many comparative sentences as they can in two minutes.","q":[["g","Beijing is ___ than my hometown.",["bigger","more big","biger"],"big → bigger (double the g)."],["g","This book is ___ than that one.",["more interesting","interestinger","more interestinger"],"Long adjective → more + adjective."],["g","My English is ___ than last year.",["better","more good","gooder"],"good → better."],["g","Today is ___ than yesterday.",["hotter","hoter","more hot"]],["g","An elephant is ___ than a horse.",["heavier","more heavy","heavyer"],"Consonant + y → -ier."],["c",["My brother is taller than me.","My brother is more tall than me.","My brother is taller that me."]],["e","This test is *easyer* than the last one.","This test is easier than the last one.","Consonant + y → -ier."],["e","She is older *that* her sister.","She is older than her sister.","Comparatives use than."],["o","My brother is three years older than me","."]],"s":[["Compare two places you know: size, weather, food, people.","Shanghai is bigger than my hometown, but my hometown is quieter and cheaper."],["Compare yourself now with yourself five years ago.","I'm taller now. My English is better. I'm busier than before."]]},{"t":"Superlative adjectives","c":"I can say which is the most or least in a group.","ex":"It's the most expensive restaurant in town.","w":"the most best → the best.","r":"the + -est (the biggest) or the most + long adjective (the most expensive). Irregular: the best, the worst, the furthest. Usually + in: the tallest in the class.","tip":"Class records: who is the tallest, has the longest name, lives the furthest away? Students guess, then check.","q":[["g","It's the ___ restaurant in town.",["most expensive","expensivest","more expensive"]],["g","Who is the ___ student in the class?",["tallest","most tall","taller"]],["g","That was the ___ day of my life!",["best","most good","goodest"],"good → the best."],["g","This is the ___ room in the house.",["biggest","bigest","most big"]],["g","January is the ___ month of the year here.",["coldest","most cold","colder"]],["c",["He is the funniest person in my family.","He is the funniest person of my family.","He is the most funniest person in my family."],"Use in with a group or place. Don't use most + -est together."],["e","It's the *most_best* film I've ever seen.","It's the best film I've ever seen.","best is already a superlative."],["o","What is the longest river in the world","?"]],"s":[["Talk about your family: who is the oldest, the funniest, the best cook?","My grandpa is the oldest. My little brother is the funniest. My mum is the best cook."],["Tell me about the best, the worst and the most exciting thing this year.","The best thing was my trip to Japan. The worst was my maths test."]]},{"t":"(Not) as … as","c":"I can say two things are equal or not equal.","ex":"My phone isn't as new as yours.","w":"","r":"as + adjective + as = the same. not as … as = less: My phone isn't as new as yours (yours is newer).","tip":"Compare two students' or two objects' features using as … as and not as … as.","q":[["g","My phone isn't ___ new as yours.",["as","so as","more"]],["g","Tom is as tall ___ his father.",["as","than","like"],"as … as (not as … than)."],["g","The test wasn't as ___ as I thought.",["hard","harder","hardest"],"as + the normal adjective + as."],["g","This film is ___ good as the book.",["as","more","so"]],["c",["Tea isn't as expensive as coffee here.","Tea isn't as expensive than coffee here.","Tea isn't as more expensive as coffee here."]],["c",["She can run as fast as her brother.","She can run as faster as her brother.","She can run as fast than her brother."]],["e","My bag is not as heavy *than* yours.","My bag is not as heavy as yours.","as … as."],["o","He can't run as fast as me","."]],"s":[["Compare two sports, two seasons or two school subjects with not as … as.","Football isn't as dangerous as rugby. Winter isn't as nice as spring."],["Say \"My sister is older than me\" with not as … as. Then make two more about your family.","I'm not as old as my sister. My dad isn't as tall as my uncle."]]},{"t":"Adverbs of manner","c":"I can describe how people do things.","ex":"She speaks quietly. He drives carefully.","w":"She speaks English good → well.","r":"Adjective + -ly: quick→quickly, careful→carefully, easy→easily. Irregular: good→well, fast→fast, hard→hard. Adverbs describe verbs: She speaks quietly.","tip":"A student acts out an action \"in the manner of\" an adverb (slowly, angrily, happily); the class guesses.","q":[["g","She speaks English very ___.",["well","good","goodly"],"good → well."],["g","Please drive ___. The road is wet.",["carefully","careful","carefuly"],"It describes the verb drive → adverb."],["g","He runs very ___.",["fast","fastly","faster"],"fast → fast (no -ly)."],["g","The children played ___ in the garden.",["happily","happy","happyly"],"y → -ily."],["g","She is a ___ driver.",["careful","carefully","care"],"It describes the noun driver → adjective."],["c",["I did the test easily.","I did the test easy.","I did easily the test."],"Put the adverb after the object."],["e","He works very *hardly*.","He works very hard.","hard → hard. (hardly means almost not.)"],["o","Please speak more slowly",".","",["Speak more slowly please"]]],"s":[["Describe how people in your family do things: drive, cook, sing, talk.","My dad drives carefully. My sister sings badly! My mum talks quickly."],["Tell me how you do five things: homework, getting up, eating, running, speaking English.","I get up slowly. I eat quickly. I speak English quite well."]]},{"t":"-ed and -ing adjectives","c":"I can describe feelings and the things that cause them.","ex":"The film was boring, so I was bored.","w":"I'm boring (meaning bored).","r":"-ing describes the thing that causes the feeling (a boring film). -ed describes how a person feels (I was bored).","tip":"Show picture pairs: a boring lesson / bored students. Students make both sentences for each pair.","q":[["g","The film was very ___.",["boring","bored","bore"],"The film causes the feeling → -ing."],["g","I was ___ because the film was so long.",["bored","boring","bore"],"How I feel → -ed."],["g","She is ___ in science.",["interested","interesting","interest"],"How she feels → -ed."],["g","The news was ___. Everyone was shocked.",["shocking","shocked","shock"]],["g","I'm so ___ after the long walk.",["tired","tiring","tire"]],["c",["I'm excited about the trip.","I'm exciting about the trip.","I'm excite about the trip."],"How I feel → -ed."],["e","Maths is *confused* for me.","Maths is confusing for me.","Maths causes the feeling → -ing."],["o","That was a really surprising ending","."]],"s":[["Tell me about something boring, something exciting and something frightening.","Long car journeys are boring. Roller coasters are exciting. Spiders are frightening."],["How do you feel…? before an exam, on holiday, on a rainy day, in a horror film.","Before exams I feel worried. On holiday I'm relaxed. In horror films I'm frightened."]]},{"t":"Too and enough","c":"I can say something is more or less than needed.","ex":"It's too cold to swim. He isn't old enough to drive.","w":"enough old → old enough.","r":"too + adjective = more than is OK (too cold to swim). adjective + enough = OK (old enough). enough + noun (enough money).","tip":"Show pictures: a tiny chair, a huge coat. Students say \"It's too small\" / \"It isn't big enough\".","q":[["g","It's ___ cold to swim today.",["too","enough","very"]],["g","He isn't ___ to drive. He's only 15.",["old enough","enough old","too old"],"Adjective + enough."],["g","We don't have ___ for a taxi.",["enough money","money enough","too money"],"enough + noun."],["g","This tea is ___ hot to drink. Wait a minute.",["too","enough","so much"]],["g","Is the room big ___ for ten people?",["enough","too","very"]],["c",["The shoes are too small for me.","The shoes are too much small for me.","The shoes are enough small for me."]],["e","I'm not *enough_tall* to play basketball.","I'm not tall enough to play basketball.","Adjective + enough."],["o","Are you warm enough in that jacket","?"]],"s":[["Explain why you can't do these: drive a car, lift a car, buy a house.","I'm too young to drive. I'm not strong enough to lift a car. I don't have enough money for a house."],["Complain about a hotel room or a meal using too and not … enough.","The bed is too small. The room isn't clean enough. The soup is too salty."]]},{"t":"Quantifiers: a lot of, much, many, a few, a little","c":"I can talk about large and small quantities.","ex":"There isn't much time. I have a few friends here.","w":"a few money → a little money.","r":"a lot of + any noun. much + uncountable, many + countable (mainly in questions and negatives). a few + countable, a little + uncountable.","tip":"Show a kitchen picture. Students describe it with a lot of, not much, not many, a few, a little.","q":[["g","There isn't ___ time. Hurry up!",["much","many","a few"],"time is uncountable → much."],["g","I have ___ good friends at school.",["a few","a little","much"],"friends are countable → a few."],["g","Can I have ___ milk in my coffee?",["a little","a few","many"],"milk is uncountable → a little."],["g","How ___ people came to the party?",["many","much","a little"]],["g","She has ___ books — more than 500!",["a lot of","much","a little"]],["c",["We don't have many eggs.","We don't have much eggs.","We don't have a little eggs."],"eggs are countable → many."],["e","I need a *few* help with this.","I need a little help with this.","help is uncountable → a little."],["o","There are a lot of students in my class",".","",["In my class there are a lot of students"]]],"s":[["Describe what you eat in a normal week. Use a lot of, not much, not many, a few, a little.","I eat a lot of rice. I don't eat much meat. I eat a few eggs."],["Describe your town. What is there a lot of? What isn't there much of?","There are a lot of cars. There aren't many parks. There isn't much noise at night."]]}]},{"n":"Modal verbs","p":[{"t":"Have to / don't have to","c":"I can talk about rules and things that are not necessary.","ex":"I have to wear a uniform. We don't have to pay.","w":"","r":"have to / has to = it's necessary (a rule). don't / doesn't have to = it isn't necessary (you can choose).","tip":"Students compare school days and weekends: \"At school I have to… At the weekend I don't have to…\"","q":[["g","I ___ wear a uniform at school.",["have to","has to","must to"]],["g","She ___ get up early on Sundays. She can sleep.",["doesn't have to","mustn't","don't have to"],"Not necessary → doesn't have to."],["g","___ you have to work tomorrow?",["Do","Have","Are"]],["g","We ___ pay. The museum is free.",["don't have to","mustn't","haven't to"]],["g","My dad ___ travel a lot for his job.",["has to","have to","must to"],"he → has to."],["c",["Do I have to bring my passport?","Have I to bring my passport?","Do I have bring my passport?"]],["e","He *have* to finish his project today.","He has to finish his project today.","he → has to."],["o","What time do you have to be at school","?"]],"s":[["Tell me three things you have to do and three things you don't have to do at home.","I have to tidy my room. I don't have to cook."],["Choose a job. What does this person have to do?","A nurse has to work at night. She has to be kind. She doesn't have to wear a suit."]]},{"t":"Must / mustn't","c":"I can talk about strong obligation and prohibition.","ex":"You mustn't use your phone in the exam.","w":"Mixing mustn't (not allowed) and don't have to (not necessary).","r":"must = strong obligation. mustn't = it isn't allowed. Careful: mustn't (don't do it!) is not the same as don't have to (it isn't necessary).","tip":"Students design signs for a library or swimming pool (\"You mustn't run\"), then contrast with \"You don't have to…\"","q":[["g","You ___ use your phone in the exam. It's not allowed.",["mustn't","don't have to","must"]],["g","You ___ wear a seatbelt in the car.",["must","mustn't","don't have to"]],["g","You ___ come if you're busy. It's OK.",["don't have to","mustn't","must not"],"Not necessary → don't have to."],["g","Students ___ shout in the library.",["mustn't","don't have to","must"]],["c",["I must remember to call my grandma.","I must to remember to call my grandma.","I must remembering to call my grandma."],"must + base verb."],["c",["You mustn't touch the paintings.","You don't must touch the paintings.","You mustn't to touch the paintings."]],["e","Tomorrow is Saturday, so we *mustn't* go to school.","Tomorrow is Saturday, so we don't have to go to school.","It isn't necessary → don't have to."],["o","You must not park here","."]],"s":[["Make rules for a swimming pool: three with must and three with mustn't.","You must have a shower first. You mustn't run. You mustn't eat in the water."],["Tell a new student one thing they must do, one they mustn't do and one they don't have to do.","You must wear the uniform. You mustn't be late. You don't have to buy the books."]]},{"t":"Should / shouldn't for advice","c":"I can give and ask for advice.","ex":"You should see a doctor.","w":"You should to go → You should go.","r":"should / shouldn't + base verb to give advice. Ask for advice: What should I do? Should I…?","tip":"Read a short problem (\"I can't sleep\"). Each student gives one piece of advice with should.","q":[["g","You look tired. You ___ go to bed early.",["should","should to","shoulds"]],["g","You ___ eat so much sugar.",["shouldn't","don't should","should no"]],["g","What ___ I wear to the party?",["should","do","must to"]],["g","I think he ___ see a doctor.",["should","shoulds","should to"],"should never takes -s or to."],["c",["Should I call her?","Do I should call her?","Should I to call her?"]],["c",["You shouldn't drink coffee at night.","You don't should drink coffee at night.","You shouldn't to drink coffee at night."]],["e","You should *to* study more for the test.","You should study more for the test.","should + base verb (no to)."],["o","What do you think I should do","?"]],"s":[["Give advice: \"I want to improve my English.\" \"I'm always late.\" \"I have a headache.\"","You should watch films in English. You should get up earlier. You should drink some water."],["Ask a partner for advice about a real problem, then give advice back.","— What should I do? — I think you should talk to your teacher."]]},{"t":"Can, could, may for requests and permission","c":"I can make polite requests and ask permission.","ex":"Could you help me? May I sit here?","w":"","r":"Can I…? (friendly) · Could I / Could you…? (more polite) · May I…? (formal, only with I / we). Answers: Sure. / Of course. / Sorry, …","tip":"Role-play in a classroom, restaurant and shop. Students make polite requests and answer them.","q":[["g","___ you help me with this bag, please?",["Could","May","Should"],"Asking someone to do something → Could you…?"],["g","Excuse me, ___ I sit here?",["may","should","must"]],["g","Could you ___ the window, please?",["open","to open","opening"]],["g","Could I ___ a glass of water, please?",["have","to have","having"]],["c",["Could you tell me the time, please?","Could you to tell me the time, please?","You could tell me the time, please?"]],["c",["May I use your bathroom?","May I to use your bathroom?","Do I may use your bathroom?"]],["e","*May* you pass me the salt, please?","Could you pass me the salt, please?","May is only for I / we. Ask others with Could you…?"],["o","Could you say that again please","?","",["Please could you say that again"]]],"s":[["Make polite requests: borrow a phone, ask for help with homework, ask someone to turn the music down.","Could I borrow your phone, please? Could you help me with this? Could you turn the music down?"],["You are in a restaurant. Make three requests to the waiter.","Could we have the menu, please? Could I have some water? Can we pay, please?"]]},{"t":"Might / may for possibility","c":"I can talk about things that are possible but not certain.","ex":"I might go to the party.","w":"","r":"might / may + base verb = perhaps; it's possible but not certain: I might go to the party. Negative: might not / may not.","tip":"Students answer \"What are you doing this weekend?\" using might when they are not sure.","q":[["g","Take an umbrella. It ___ rain later.",["might","must","should to"]],["g","I'm not sure. I ___ go to the party.",["may","will","am"],"Not sure → may / might."],["g","She ___ not come. She's feeling ill.",["might","must","can"]],["g","We ___ to the beach tomorrow. It depends on the weather.",["might go","might to go","might going"]],["g","Is that Tom's car? — I'm not sure. It ___ be.",["might","must","will"]],["c",["He might be at home.","He might is at home.","He mights be at home."],"might + base verb."],["e","I *maybe* go to London next year.","I might go to London next year.","maybe is not a verb. Say I might go or Maybe I'll go."],["o","I might not finish my homework tonight",".","",["Tonight I might not finish my homework"]]],"s":[["Talk about next year: three things you will definitely do and three things you might do.","I'll start a new class. I might learn the guitar. I might visit Japan."],["Guess what is in the teacher's bag using might be / may be.","It might be a book. It may be an orange. It might not be food."]]}]},{"n":"Verb patterns and sentences","p":[{"t":"Verb + to-infinitive and verb + -ing","c":"I can use common verbs with the correct pattern.","ex":"I want to travel. I enjoy cooking.","w":"I enjoy to swim → I enjoy swimming.","r":"Verb + to: want, need, hope, decide, plan, would like. Verb + -ing: enjoy, finish, mind, stop. (like / love / hate can take both.)","tip":"Two columns, \"to\" and \"-ing\". Students sort verb cards, then make a true sentence with each.","q":[["g","I want ___ abroad.",["to travel","travelling","travel"],"want + to."],["g","She enjoys ___.",["cooking","to cook","cook"],"enjoy + -ing."],["g","We decided ___ a taxi.",["to take","taking","take"],"decide + to."],["g","Have you finished ___ the book?",["reading","to read","read"],"finish + -ing."],["g","I hope ___ you soon.",["to see","seeing","see"]],["g","Do you mind ___ the door?",["opening","to open","open"],"mind + -ing."],["c",["He needs to buy a new laptop.","He needs buying a new laptop.","He needs buy a new laptop."]],["e","I enjoy *to_swim* in the sea.","I enjoy swimming in the sea.","enjoy + -ing."],["o","I would like to learn Spanish","."]],"s":[["Tell me something you enjoy doing, something you want to do this year, and something you hope to do one day.","I enjoy playing tennis. I want to visit Japan. I hope to be a doctor one day."],["Talk about your plans after school using want to, hope to, plan to and would like to.","I'd like to be a vet. I hope to study in Australia."]]},{"t":"Infinitive of purpose","c":"I can explain why I do things.","ex":"I went to the shop to buy milk.","w":"for buy → to buy.","r":"Use to + verb to say why: I went to the shop to buy milk. (Not \"for buy\".)","tip":"Name places (bank, library, airport). Students say why people go there: \"People go to the library to borrow books.\"","q":[["g","I went to the shop ___ some milk.",["to buy","for buy","for buying"],"Purpose → to + verb."],["g","She's saving money ___ a new bike.",["to buy","for buy","buying"]],["g","We use a key ___ the door.",["to open","for open","opening"]],["g","He called ___ sorry.",["to say","for say","saying"]],["g","Why did you go to the bank? — ___ some money.",["To get","For get","For getting"]],["c",["I'm learning English to get a better job.","I'm learning English for get a better job.","I'm learning English for to get a better job."]],["e","I came here *for* see you.","I came here to see you.","Purpose → to + verb."],["o","She went to the library to study","."]],"s":[["Why do people go to these places? the airport, the hospital, the gym, the supermarket.","People go to the gym to get fit. People go to the airport to catch a plane."],["Why are you learning English? Give three reasons with to.","I'm learning English to travel, to watch films and to get a good job."]]},{"t":"Zero conditional","c":"I can talk about general truths and facts.","ex":"If you heat ice, it melts.","w":"","r":"If / When + present simple, present simple — for things that are always true: If you heat ice, it melts.","tip":"Mix science facts and personal habits: \"If I'm tired, I…\", \"If you mix red and blue, you get…\"","q":[["g","If you heat water to 100°C, it ___.",["boils","will boil","boiled"],"Always true → present simple in both parts."],["g","If I ___ coffee at night, I can't sleep.",["drink","will drink","drank"]],["g","Plants die if they ___ water.",["don't get","won't get","didn't get"]],["g","If you mix red and white, you ___ pink.",["get","will got","got"]],["c",["When it rains, the streets get wet.","When it will rain, the streets get wet.","When it rains, the streets gets wet."]],["e","If my cat is hungry, it *meowing*.","If my cat is hungry, it meows.","Present simple in both parts."],["e","If you *will_press* this button, the light goes on.","If you press this button, the light goes on.","No will after if."],["o","What do you do if you feel sad","?","",["If you feel sad what do you do"]]],"s":[["Complete: If I'm hungry,… If I'm bored,… If I'm late for school,…","If I'm hungry, I eat a snack. If I'm bored, I read. If I'm late, I run."],["Tell me two science facts with if.","If you freeze water, it turns into ice. If you drop something, it falls."]]},{"t":"First conditional","c":"I can talk about real possible future situations and results.","ex":"If it rains, we'll stay at home.","w":"If it will rain → If it rains.","r":"If + present simple, will + verb — for real possible future situations. No will after if: If it rains, we'll stay at home.","tip":"Chain game: \"If I go to the party, I'll see Tom. If I see Tom, I'll…\" Each student continues the chain.","q":[["g","If it ___, we'll stay at home.",["rains","will rain","rained"],"No will after if."],["g","If you study, you ___ the test.",["will pass","pass","passed"]],["g","If I ___ time, I'll call you.",["have","will have","had"]],["g","What will you do if you ___ the bus?",["miss","will miss","missed"]],["g","She ___ be angry if you don't tell her.",["will","is","does"]],["c",["If we hurry, we'll catch the train.","If we will hurry, we'll catch the train.","If we hurry, we catch the train tomorrow."]],["e","If you *will* come to my party, I'll be very happy.","If you come to my party, I'll be very happy.","No will after if."],["o","What will you do if it snows tomorrow","?","",["If it snows tomorrow what will you do"]]],"s":[["Finish: If I pass my exams,… If it's sunny on Saturday,… If I don't sleep enough,…","If I pass my exams, my parents will be happy. If it's sunny, we'll go to the park."],["Make a chain: If I get a dog,…","If I get a dog, I'll walk it every day. If I walk it every day, I'll be fit."]]},{"t":"Defining relative clauses: who, which, that, where","c":"I can say which person, thing or place I mean.","ex":"She's the teacher who helped me. That's the café where we met.","w":"the man which → the man who.","r":"who for people · which for things · that for people or things · where for places: She's the teacher who helped me.","tip":"\"Guess the word\": students define a person, thing or place with who / which / where; the class guesses.","q":[["g","She's the teacher ___ helped me.",["who","which","where"],"Person → who."],["g","This is the phone ___ I bought yesterday.",["that","who","where"],"Thing → that / which."],["g","That's the café ___ we met.",["where","which","who"],"Place → where."],["g","A dentist is a person ___ looks after your teeth.",["who","which","where"]],["g","I lost the book ___ you gave me.",["which","who","where"]],["c",["The man who lives next door is a pilot.","The man which lives next door is a pilot.","The man who he lives next door is a pilot."],"Don't repeat the subject (he) after who."],["e","This is the house *which* I was born.","This is the house where I was born.","Place → where."],["o","Is this the bus that goes to the station","?"]],"s":[["Define these words without saying them: a chef, a library, a fridge, a nurse.","It's a person who cooks in a restaurant. It's a place where you borrow books."],["Describe a person, a place and a thing that are important to you.","My aunt is the person who taught me to swim. The park is the place where I relax."]]},{"t":"Subject and object questions","c":"I can ask questions about the subject and the object.","ex":"Who called you? Who did you call?","w":"Who did call you? → Who called you?","r":"Subject question (the question word is the subject): no do / did — Who called you? Object question: use do / did — Who did you call?","tip":"Write \"Mia called Ben.\" Ask \"Who called Ben?\" (Mia) and \"Who did Mia call?\" (Ben). Students make pairs from new sentences.","q":[["g","Who ___ you? — My mum called me.",["called","did call","did called"],"Who is the subject → no did."],["g","Who ___ call? — I called my mum.",["did you","you","do you"],"Who is the object → did you."],["g","What ___? — There was an accident.",["happened","did happen","did it happen"]],["g","Who ___ this book? — My uncle wrote it.",["wrote","did write","did wrote"]],["g","What ___ eat for lunch? — Pizza.",["did you","you","you did"]],["c",["Who lives in that house?","Who does live in that house?","Who does lives in that house?"]],["e","Who *did* break the window?","Who broke the window?","Who is the subject → no did."],["o","Who did you see at the party","?"]],"s":[["Ask three questions about this sentence: \"Anna gave Tom a present.\"","Who gave Tom a present? Who did Anna give a present to? What did Anna give Tom?"],["Ask a partner: Who helps you most? Who did you talk to yesterday? What makes you happy?","Who helps you with your homework? — My sister helps me."]]},{"t":"Indefinite pronouns","c":"I can use something, anyone, nobody, everywhere, etc.","ex":"Is there anything to eat? Nobody knows.","w":"Nobody doesn't know → Nobody knows.","r":"some- in positive sentences and offers · any- in questions and negatives · no- with a positive verb (Nobody knows) · every- = all. -one/-body = people, -thing = things, -where = places.","tip":"Hide an object. Students ask \"Is it somewhere near the door?\" Then practise \"There's nothing in my hand.\"","q":[["g","I'm hungry, but there's ___ in the fridge.",["nothing","anything","something"],"Positive verb (is) + nothing."],["g","I didn't see ___ at the park.",["anyone","someone","no one"],"Negative → any-."],["g","It's a very difficult question. ___ knows the answer — not even the teacher!",["Nobody","Anybody","Everybody"],"Positive verb (knows) + nobody."],["g","I can't find my keys ___.",["anywhere","somewhere","nowhere"]],["g","___ in my class likes music. All 25 students!",["Everyone","Anyone","No one"]],["g","There's ___ at the door. Can you open it?",["someone","anyone","no one"]],["c",["Nobody called me today.","Nobody didn't call me today.","Anybody called me today."],"Use only one negative."],["e","I don't know *nothing* about it.","I don't know anything about it.","Only one negative: don't … anything."],["o","Would you like something to drink","?"]],"s":[["Describe your weekend: something you did, somewhere you went, someone you met.","I did something fun. I went somewhere new. I met someone from Canada."],["Answer in full sentences: Did you buy anything yesterday? Is anyone in your family a teacher?","No, I didn't buy anything. No, nobody in my family is a teacher."]]},{"t":"Possessive pronouns and whose","c":"I can ask and say who things belong to.","ex":"Whose bag is this? It's mine.","w":"It's my → It's mine.","r":"Possessive pronouns stand alone (no noun after them): mine, yours, his, hers, ours, theirs. Ask with Whose…? (Who's = who is.)","tip":"Lost property box: students take out an item and ask \"Whose is this?\" — \"It's mine / It's hers.\"","q":[["g","Whose bag is this? — It's ___.",["mine","my","me"]],["g","This isn't my coat. It's Lisa's. It's ___.",["hers","her","she's"]],["g","___ shoes are these?",["Whose","Who's","Who"],"Who's = who is."],["g","Our house is small, but our neighbours' house is huge. ___ is huge.",["Theirs","Their","Them"]],["g","Is this pen ___?",["yours","your","you're"]],["c",["That car is ours.","That car is our.","That car is ours car."]],["e","Is that phone *your*?","Is that phone yours?","No noun after it → yours."],["o","Whose idea was it","?"]],"s":[["Collect three things from classmates. Ask and answer with Whose…? and mine / yours / his / hers.","Whose is this? — It's mine. Whose pen is that? — It's his."],["Compare your things with a partner's.","My bag is blue; yours is black. My phone is older than yours."]]},{"t":"Linking with so, because, but, although","c":"I can connect ideas to show reason, result and contrast.","ex":"It was late, so we took a taxi.","w":"","r":"because + reason · so + result · but + contrast · although + contrast. Don't use although and but together, or because and so together.","tip":"Give a situation (\"It was raining\"). Students continue it four times with so, because, but and although.","q":[["g","It was late, ___ we took a taxi.",["so","because","although"],"Result → so."],["g","I didn't go out ___ I was tired.",["because","so","although"],"Reason → because."],["g","___ it was cold, we went swimming.",["Although","Because","So"],"Contrast → although."],["g","She studied hard, ___ she didn't pass.",["but","so","because"],"Contrast → but."],["c",["Although he was ill, he went to work.","Although he was ill, but he went to work.","Although he was ill, so he went to work."],"Use only one linker."],["c",["I was hungry, so I made a sandwich.","I was hungry, because I made a sandwich.","So I was hungry, I made a sandwich."]],["e","Because it was raining, *so* we stayed at home.","Because it was raining, we stayed at home.","Use only one linker: because … or … so, not both."],["o","We stayed inside because it was raining",".","",["Because it was raining we stayed inside"]]],"s":[["Tell me about a difficult day using so, because, but and although.","I was tired because I didn't sleep, but I went to school. Although it was hard, I finished my test, so I was happy."],["Is it better to live in a city or in the countryside? Give reasons.","I prefer the city because there's more to do, although it's noisy."]]}]}],"homeUrl":"./","otherUrl":"a1.html","otherLabel":"A1 Grammar Quick Checks","newTab":false};

/* ---------- data prep ---------- */
const P = [];
L.units.forEach((u, ui) => { u.start = P.length + 1; u.p.forEach(p => { p.no = P.length + 1; p.unit = ui; P.push(p); }); u.end = P.length; });
const TOTALQ = P.reduce((a, p) => a + p.q.length, 0);

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.toLowerCase().replace(/[,.!?]/g, "").replace(/\s+/g, " ").trim();
const NOWORD = "(no word)";

function fillGap(text, word) {
  if (word === NOWORD) return text.replace(/ ___/, "").replace(/___ /, "");
  return text.replace("___", word);
}
function prep(raw, point) {
  const q = { t: raw[0], point };
  if (q.t === "g") { q.text = raw[1]; q.answer = raw[2][0]; q.opts = shuffle(raw[2]); q.why = raw[3]; q.full = fillGap(raw[1], raw[2][0]); }
  if (q.t === "c") { q.answer = raw[1][0]; q.opts = shuffle(raw[1]); q.why = raw[2]; q.full = raw[1][0]; }
  if (q.t === "e") {
    q.toks = raw[1].split(" ").map(w => { const m = /^\*(.+)\*([.,!?]?)$/.exec(w); return m ? { w: m[1].replace(/_/g, " ") + m[2], bad: true } : { w: w.replace(/_/g, " "), bad: false }; });
    q.full = raw[2]; q.why = raw[3];
  }
  if (q.t === "o") {
    q.words = raw[1].split(" ").map(w => w.replace(/_/g, " "));
    q.punct = raw[2]; q.why = raw[3];
    q.alts = [q.words.join(" "), ...(raw[4] || [])].map(norm);
    let idx; do { idx = shuffle(q.words.map((_, i) => i)); } while (idx.every((v, i) => v === i) && q.words.length > 1);
    q.bank = idx; q.placed = [];
    q.full = q.words.join(" ") + q.punct;
  }
  return q;
}
const TYPE_LABEL = { g: "Choose the correct word", c: "Which sentence is correct?", e: "Tap the mistake", o: "Put the words in order" };

/* ---------- state ---------- */
const S = { view: "home", round: null, notes: false };
let size = "m";
try { size = localStorage.getItem("lli-qsize") || "m"; } catch (e) {}
function applySize() {
  document.documentElement.dataset.size = size;
  document.getElementById("sizeBtn").textContent = "Text size: " + { m: "M", l: "L", xl: "XL" }[size];
}

function startPoint(no) {
  const p = P[no - 1];
  const items = shuffle(p.q).slice(0, Math.min(6, p.q.length)).map(r => prep(r, p));
  S.round = { mode: "point", point: p, items, i: 0, res: [], speak: null, sprompt: p.s[Math.floor(Math.random() * p.s.length)], showModel: false };
  S.view = "q"; S.notes = false; render(true);
}
function startUnit(ui) {
  const u = L.units[ui];
  const pools = u.p.map(p => ({ p, qs: shuffle(p.q) }));
  const want = Math.min(10, pools.reduce((a, x) => a + x.qs.length, 0));
  const items = [];
  let order = shuffle(pools);
  while (items.length < want) {
    for (const x of order) { if (items.length >= want) break; const r = x.qs.pop(); if (r) items.push(prep(r, x.p)); }
    order = shuffle(order);
  }
  S.round = { mode: "unit", unit: u, ui, items: shuffle(items), i: 0, res: [] };
  S.view = "q"; render(true);
}
function startDiag() {
  const items = P.map(p => prep(p.q[Math.floor(Math.random() * p.q.length)], p));
  S.round = { mode: "diag", items, i: 0, res: [] };
  S.view = "q"; render(true);
}
function again() {
  const r = S.round;
  if (r.mode === "point") startPoint(r.point.no);
  else if (r.mode === "unit") startUnit(r.ui);
  else startDiag();
}

/* ---------- answering ---------- */
function cur() { return S.round.items[S.round.i]; }
function answered() { return S.round.res[S.round.i] !== undefined; }
function choose(k) {
  const q = cur(); if (answered() || !q.opts || !q.opts[k]) return;
  S.round.res[S.round.i] = { ok: q.opts[k] === q.answer, given: q.opts[k] };
  render();
}
function tapWord(k) {
  const q = cur(); if (answered()) return;
  S.round.res[S.round.i] = { ok: q.toks[k].bad, given: q.toks[k].w, pick: k };
  render();
}
function place(k) { const q = cur(); if (answered()) return; q.placed.push(k); render(); }
function unplace(pos) { const q = cur(); if (answered()) return; q.placed.splice(pos, 1); render(); }
function clearOrder() { const q = cur(); if (answered()) return; q.placed = []; render(); }
function checkOrder() {
  const q = cur(); if (answered() || q.placed.length !== q.words.length) return;
  const given = q.placed.map(i => q.words[i]).join(" ");
  S.round.res[S.round.i] = { ok: q.alts.includes(norm(given)), given: given + q.punct };
  render();
}
function next() {
  const r = S.round; if (!answered()) return;
  r.i++;
  if (r.i >= r.items.length) S.view = r.mode === "point" ? "speak" : "results";
  render(true);
}
function rateSpeak(v) { S.round.speak = v; S.view = "results"; render(true); }

/* ---------- render: home ---------- */
function homeHTML() {
  const next = L.next ? L.next : null;
  return `
  <section class="shell hero">
    <div class="eyebrow">CEFR ${esc(L.code)} · ${esc(L.name)}</div>
    <h1>${esc(L.code)} Grammar Quick Checks</h1>
    <p>Short, reusable checks for every point on the LLI ${esc(L.code)} Grammar Mastery Checklist. Project them in class or use them one-to-one. Each round draws new questions, so you can run a point again and again.</p>
    <div class="stats"><span><b>${P.length}</b> grammar points</span><span><b>${L.units.length}</b> units</span><span><b>${TOTALQ}</b> questions in the bank</span><span><b>6</b> questions + a speaking task per check</span></div>
  </section>
  <section class="shell modes" aria-label="Ways to check">
    <button class="mode primary" data-act="diag">
      <h3>Level diagnostic</h3>
      <p>One question for each of the ${P.length} points. Shows which sessions to check next. About 15 minutes.</p>
      <span class="go">Start diagnostic →</span>
    </button>
    <div class="mode">
      <h3>Point check</h3>
      <p>Six questions on one grammar point, then a speaking task. Suggests a checklist stage at the end. About 10 minutes.</p>
      <span class="go">Choose a point below ↓</span>
    </div>
    <div class="mode">
      <h3>Unit review</h3>
      <p>Ten mixed questions across one unit. Good for revision lessons and before moving on.</p>
      <span class="go">Use “Unit review” on any unit ↓</span>
    </div>
  </section>
  <section class="shell">
    <details class="guide">
      <summary>Teacher guide: how to run a quick check</summary>
      <div class="body">
        <ol class="steps">
          <li><span>Choose the point you have just taught, or one marked <b>Introduced</b> or <b>Practising</b> on the student's checklist.</span></li>
          <li><span>Project the page (Full screen helps) or sit beside the student. Read each question aloud.</span></li>
          <li><span>Students answer aloud, on mini whiteboards or on paper. Then tap the answer the student — or most of the class — gave. Keys 1, 2, 3 choose an option; Enter moves on.</span></li>
          <li><span>Read the short explanation together after each answer. If several students get it wrong, open <b>Teacher notes</b> for the rule and a quick-fix activity.</span></li>
          <li><span>Finish with the speaking task. Let the student answer in their own words, listen for the target grammar, then rate what you heard.</span></li>
          <li><span>Use the suggested stage to update the Grammar Mastery Checklist. Press <b>New round</b> for a fresh set of questions any time.</span></li>
        </ol>
        <div class="stage-key">
          <div><b>Introduced</b>Taught and understood with support.</div>
          <div><b>Practising</b>Used in guided tasks; errors still happen.</div>
          <div><b>Mastered</b>Used independently in real speaking or writing, about 80%+ accurate.</div>
        </div>
        <p class="note">A quick check shows control in practice questions. Before ticking Mastered, also look for correct use in the student's own speaking or writing on another day.</p>
      </div>
    </details>
  </section>
  ${L.units.map((u, ui) => `
  <section class="shell unit">
    <div class="unit-head">
      <div><div class="u">Unit ${ui + 1}</div><h2>${esc(u.n)}</h2></div>
      <span class="s">Sessions ${u.start === u.end ? u.start : u.start + "–" + u.end}</span>
      <div class="grow"></div>
      <button class="unit-btn" data-act="unit" data-v="${ui}">Unit review</button>
    </div>
    <div class="points">
      ${u.p.map(p => `<button class="pt" data-act="point" data-v="${p.no}"><span class="n">${pad(p.no)}</span><span><span class="t">${esc(p.t)}</span><span class="c">${esc(p.c)}</span></span><span class="arrow" aria-hidden="true">›</span></button>`).join("")}
    </div>
  </section>`).join("")}
  <footer class="shell"><span>LLI · Lexilink Ideation</span><span>${esc(L.code)} Grammar Quick Checks</span>${L.homeUrl ? `<a href="${esc(L.homeUrl)}">All levels</a>` : ""}${L.otherUrl ? `<a href="${esc(L.otherUrl)}"${L.newTab ? ' target="_blank" rel="noopener"' : ""}>${esc(L.otherLabel)} →</a>` : ""}</footer>`;
}

/* ---------- render: question ---------- */
function progressHTML() {
  const r = S.round;
  return `<div class="progress" aria-hidden="true">${r.items.map((_, i) => {
    const x = r.res[i]; return `<span class="${x ? (x.ok ? "ok" : "no") : (i === r.i && S.view === "q" ? "cur" : "")}"></span>`; }).join("")}${r.mode === "point" ? `<span class="sp ${S.view === "speak" ? "cur" : (r.speak ? "ok" : "")}"></span>` : ""}</div>`;
}
function crumbsHTML() {
  const r = S.round;
  let title;
  if (r.mode === "point") title = `<small>Session ${pad(r.point.no)}</small>${esc(r.point.t)}`;
  else if (r.mode === "unit") title = `<small>Unit ${r.ui + 1} review</small>${esc(r.unit.n)}`;
  else title = `<small>${esc(L.code)} diagnostic</small>One question per grammar point`;
  const notesBtn = r.mode === "point" && S.view !== "results" ? `<button class="notes-btn" data-act="notes" aria-expanded="${S.notes}">Teacher notes</button>` : "";
  return `<div class="crumbs"><button class="back" data-act="home">← All points</button><div class="crumb-title">${title}</div><div class="grow"></div>${notesBtn}</div>`;
}
function notesHTML() {
  const p = S.round.point;
  return `<dl class="notes">
    <dt>Rule</dt><dd>${esc(p.r)}</dd>
    ${p.ex ? `<dt>Example</dt><dd><i>${esc(p.ex)}</i></dd>` : ""}
    ${p.w ? `<dt>Listen for</dt><dd>${esc(p.w)}</dd>` : ""}
    <dt>Quick fix</dt><dd>${esc(p.tip)}</dd>
  </dl>`;
}
function questionHTML() {
  const r = S.round, q = cur(), res = r.res[r.i], done = res !== undefined;
  let body = "";
  if (q.t === "g") {
    const gapWord = done ? (res.ok ? q.answer : res.given) : "";
    const gapShow = gapWord === NOWORD ? "—" : gapWord;
    const gap = `<span class="gap ${done ? (res.ok ? "ok" : "no") : ""}">${done ? esc(gapShow) : "&nbsp;"}</span>`;
    body = `<p class="qtext">${esc(q.text).replace("___", gap)}</p>` + optsHTML(q, res, false);
  } else if (q.t === "c") {
    body = optsHTML(q, res, true);
  } else if (q.t === "e") {
    body = `<div class="words">${q.toks.map((t, k) => {
      let cls = ""; if (done) { if (t.bad) cls = "bad"; else if (res.pick === k) cls = "picked"; }
      return `<button class="word ${cls}" data-act="word" data-v="${k}" ${done ? "disabled" : ""}>${esc(t.w)}</button>`; }).join("")}</div>`;
  } else if (q.t === "o") {
    const placedSet = new Set(q.placed);
    body = `<div class="line ${done ? (res.ok ? "done-ok" : "done-no") : ""}" aria-label="Your sentence">
        ${q.placed.length ? q.placed.map((k, pos) => `<button class="tile" data-act="unplace" data-v="${pos}" ${done ? "disabled" : ""}>${esc(q.words[k])}</button>`).join("") : `<span class="placeholder">Tap the words below in the right order.</span>`}
        ${q.placed.length ? `<span class="punct">${esc(q.punct)}</span>` : ""}
      </div>
      ${done ? "" : `<div class="bank">${q.bank.map(k => `<button class="tile ${placedSet.has(k) ? "used" : ""}" data-act="place" data-v="${k}" ${placedSet.has(k) ? 'tabindex="-1" aria-hidden="true"' : ""}>${esc(q.words[k])}</button>`).join("")}</div>
      <div class="order-tools"><button class="btn" data-act="checkorder" ${q.placed.length === q.words.length ? "" : "disabled"}>Check<span class="kbd">Enter</span></button><button class="btn ghost" data-act="clear">Clear</button></div>`}`;
  }
  let fb = "";
  if (done) {
    const why = q.why || q.point.r;
    const from = r.mode !== "point" ? `<p class="from">Session ${pad(q.point.no)} · ${esc(q.point.t)}</p>` : "";
    fb = `<div class="fb ${res.ok ? "ok" : "no"}" role="status">
      <p class="v">${res.ok ? "Correct." : "Not quite."}</p>
      <p class="ans">${esc(q.full)}</p>
      <p class="why">${esc(why)}</p>${from}
    </div>
    <div class="next-row"><button class="btn" data-act="next" id="nextBtn">${r.i + 1 >= r.items.length ? (r.mode === "point" ? "Speaking task" : "See results") : "Next question"}<span class="kbd">Enter</span></button></div>`;
  }
  return `<div class="card">
    <div class="qhead"><span class="qtype">${TYPE_LABEL[q.t]}</span><span class="qnum">Question ${r.i + 1} of ${r.items.length}</span></div>
    ${body}${fb}
  </div>`;
}
function optsHTML(q, res, sent) {
  const done = res !== undefined;
  return `<div class="opts ${sent ? "sent" : ""}">${q.opts.map((o, k) => {
    let cls = ""; if (done) { if (o === q.answer) cls = "right"; else if (o === res.given) cls = "wrong"; }
    return `<button class="opt ${cls}" data-act="opt" data-v="${k}" ${done ? "disabled" : ""}><span class="k">${k + 1}</span><span class="lbl">${esc(o)}</span></button>`; }).join("")}</div>`;
}
function speakHTML() {
  const r = S.round, p = r.point, [prompt, model] = r.sprompt;
  return `<div class="card speak">
    <div class="qhead"><span class="qtype">Speaking task · free use</span><span class="qnum">Last step</span></div>
    <p class="prompt">${esc(prompt)}</p>
    <p class="listen">Let the student answer in their own words. <b>Listen for:</b> ${esc(p.w || p.r)}</p>
    ${r.showModel ? `<div class="model"><b>Model answer</b><p>${esc(model)}</p></div>` : `<div><button class="btn ghost" data-act="model">Show model answer</button></div>`}
    <div class="section-label">How did the student use ${esc(p.t.toLowerCase())}?</div>
    <div class="rate">
      <button class="yes" data-act="rate" data-v="yes"><b>Used it correctly</b><span>Accurate, without help</span></button>
      <button class="partly" data-act="rate" data-v="partly"><b>Partly</b><span>Some errors or needed prompting</span></button>
      <button class="no" data-act="rate" data-v="no"><b>Not yet</b><span>Avoided it or mostly wrong</span></button>
    </div>
    <div class="next-row"><button class="btn ghost" data-act="rate" data-v="skip">Skip speaking task</button></div>
  </div>`;
}

/* ---------- render: results ---------- */
function suggestion(pct, sp) {
  if (pct >= 0.8 && sp === "yes") return { stage: 2, head: "Ready to confirm Mastered",
    text: "Accurate in this check and correct in free speaking. Tick <b>Mastered</b> once you also see correct use in the student's own speaking or writing on another day." };
  if (pct >= 0.8) return { stage: 1, head: "Practising",
    text: sp === "skip" || !sp ? "Accurate in the practice questions. Run the speaking task next time to check free use before Mastered."
      : "Accurate in the practice questions, but not yet secure in free speaking. Give more speaking and writing practice, then check again." };
  if (pct >= 0.5) return { stage: 1, head: "Practising",
    text: "Some errors. Open <b>Teacher notes</b>, go over the rule, do the quick-fix activity, then run a new round." };
  return { stage: 0, head: "Introduced — reteach",
    text: "Most answers were wrong. Reteach this point with the rule and the quick-fix activity in <b>Teacher notes</b> before practising again." };
}
function reviewList(r) {
  return `<ul class="review">${r.items.map((q, i) => { const x = r.res[i];
    return `<li><span class="mk ${x.ok ? "ok" : "no"}">${x.ok ? "✓" : "✗"}</span><div><div>${esc(q.full)}</div>${x.ok ? "" : `<div class="gv">${q.t === "e" ? "Tapped" : "Answered"}: ${esc(x.given)}</div>`}${r.mode !== "point" ? `<div class="pp">Session ${pad(q.point.no)} · ${esc(q.point.t)}</div>` : ""}</div></li>`; }).join("")}</ul>`;
}
function resultsHTML() {
  const r = S.round, n = r.items.length, ok = r.res.filter(x => x.ok).length, pct = ok / n;
  if (r.mode === "point") {
    const sg = suggestion(pct, r.speak);
    const spText = { yes: "Used it correctly", partly: "Partly", no: "Not yet", skip: "Skipped" }[r.speak] || "Skipped";
    const nextP = r.point.no < P.length ? r.point.no + 1 : null;
    return `<div class="card">
      <div class="score"><span class="big">${ok}<small> / ${n}</small></span><span class="lbl">questions correct · Speaking: <b>${spText}</b></span></div>
      <div class="section-label">Suggested checklist stage</div>
      <div class="stagebar">${["Introduced", "Practising", "Mastered"].map((s, i) => `<div class="${i === sg.stage ? "on" : ""}">${s}<small>${["Taught, needs support", "Guided use, some errors", "Independent, 80%+"][i]}</small></div>`).join("")}</div>
      <p class="advice"><b>${sg.head}.</b> ${sg.text}</p>
      <div class="next-row" style="justify-content:flex-start">
        <button class="btn" data-act="again">New round</button>
        ${nextP ? `<button class="btn ghost" data-act="point" data-v="${nextP}">Next point: ${pad(nextP)} ${esc(P[nextP - 1].t)} →</button>` : ""}
        <button class="btn ghost" data-act="home">All points</button>
      </div>
      <div class="section-label">Answers</div>
      ${reviewList(r)}
    </div>`;
  }
  // unit review & diagnostic
  const byPoint = new Map();
  r.items.forEach((q, i) => { const e = byPoint.get(q.point.no) || { p: q.point, ok: 0, n: 0 }; e.n++; if (r.res[i].ok) e.ok++; byPoint.set(q.point.no, e); });
  const entries = [...byPoint.values()].sort((a, b) => a.p.no - b.p.no);
  const missed = entries.filter(e => e.ok < e.n), got = entries.filter(e => e.ok === e.n);
  const isDiag = r.mode === "diag";
  return `<div class="card">
    <div class="score"><span class="big">${ok}<small> / ${n}</small></span><span class="lbl">${isDiag ? `grammar points answered correctly` : `questions correct across ${entries.length} point${entries.length > 1 ? "s" : ""}`}</span></div>
    ${missed.length ? `<div class="section-label">Run a point check on these</div>
      <div class="miss">${missed.map(e => `<button data-act="point" data-v="${e.p.no}"><span class="n">${pad(e.p.no)}</span><span>${esc(e.p.t)}${e.n > 1 ? ` <span class="gv">(${e.ok} of ${e.n} correct)</span>` : ""}</span><span class="go2">Point check →</span></button>`).join("")}</div>`
      : `<p class="advice"><b>No errors.</b> ${isDiag ? "Use point checks with speaking tasks to confirm Mastered for individual points." : "Run point checks with the speaking task to confirm free use."}</p>`}
    ${got.length ? `<div class="section-label">Correct this time</div><div class="chips">${got.map(e => `<span>${pad(e.p.no)} ${esc(e.p.t)}</span>`).join("")}</div>` : ""}
    <p class="caution">${isDiag ? "One question per point is a screening, not a final judgement. A correct answer can be a lucky guess, and one mistake can be a slip. Confirm with point checks." : "Use this to decide which points need another point check before you move on."}</p>
    <div class="next-row" style="justify-content:flex-start">
      <button class="btn" data-act="again">${isDiag ? "New diagnostic" : "New round"}</button>
      <button class="btn ghost" data-act="home">All points</button>
    </div>
    <div class="section-label">Answers</div>
    ${reviewList(r)}
  </div>`;
}

/* ---------- main render ---------- */
const app = document.getElementById("app");
function render(scrollTop) {
  if (S.view === "home") { app.innerHTML = homeHTML(); }
  else {
    const top = crumbsHTML() + progressHTML() + (S.round.mode === "point" && S.notes && S.view !== "results" ? notesHTML() : "");
    const main = S.view === "q" ? questionHTML() : S.view === "speak" ? speakHTML() : resultsHTML();
    app.innerHTML = `<section class="shell check">${top}${main}</section>`;
  }
  if (scrollTop) window.scrollTo(0, 0);
  const nb = document.getElementById("nextBtn"); if (nb) nb.focus({ preventScroll: true });
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const v = b.dataset.v, act = b.dataset.act;
  switch (act) {
    case "home": S.view = "home"; S.round = null; render(true); break;
    case "point": startPoint(+v); break;
    case "unit": startUnit(+v); break;
    case "diag": startDiag(); break;
    case "again": again(); break;
    case "opt": choose(+v); break;
    case "word": tapWord(+v); break;
    case "place": place(+v); break;
    case "unplace": unplace(+v); break;
    case "clear": clearOrder(); break;
    case "checkorder": checkOrder(); break;
    case "next": next(); break;
    case "notes": S.notes = !S.notes; render(); break;
    case "model": S.round.showModel = true; render(); break;
    case "rate": rateSpeak(v); break;
    case "size": size = { m: "l", l: "xl", xl: "m" }[size]; try { localStorage.setItem("lli-qsize", size); } catch (err) {} applySize(); break;
    case "full": {
      const d = document;
      try { if (d.fullscreenElement) d.exitFullscreen?.(); else d.documentElement.requestFullscreen?.()?.catch?.(() => {}); } catch (err) {}
      break; }
  }
});
document.addEventListener("keydown", e => {
  if (S.view !== "q" || e.altKey || e.ctrlKey || e.metaKey) return;
  const q = cur();
  if (/^[1-9]$/.test(e.key) && q.opts && !answered()) { e.preventDefault(); choose(+e.key - 1); }
  else if (e.key === "Enter") {
    if (e.target.closest && e.target.closest("button")) return; // native button click handles it
    if (answered()) { e.preventDefault(); next(); }
    else if (q.t === "o" && q.placed.length === q.words.length) { e.preventDefault(); checkOrder(); }
  }
});

document.getElementById("lvlChip").textContent = L.code + " Quick Checks";
applySize();
render();
</script>
</body>
</html>
