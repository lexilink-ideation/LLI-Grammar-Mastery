<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LLI C1 Grammar Quick Checks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: a single centred working column, like a teacher's clipboard. Home = units as numbered session rows; check = one large question card for projection. */
:root {
  --bg: #F4F6F9;
  --surface: #FFFFFF;
  --surface-2: #EEF2F6;
  --ink: #1B2734;
  --muted: #5B6878;
  --rule: #D5DCE4;
  --navy: #1F3A5F;
  --navy-ink: #FFFFFF;
  --gold: #8A6A2E;
  --gold-soft: #F3EBDD;
  --good: #23704F;
  --good-soft: #E3F2EA;
  --bad: #A8402F;
  --bad-soft: #F8E7E3;
  --focus: #2F6DB5;
  --shadow: 0 1px 2px rgba(20,35,55,.06), 0 6px 20px rgba(20,35,55,.06);
  --f-display: "Lexend", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --qscale: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1520; --surface: #162130; --surface-2: #1D2A3B; --ink: #E5EBF2; --muted: #9AA8B8; --rule: #2B3A4E;
    --navy: #9DBDE6; --navy-ink: #0E1520; --gold: #D5B16E; --gold-soft: #2D2717;
    --good: #6FCF9F; --good-soft: #15302A; --bad: #F0907F; --bad-soft: #3A1E1A; --focus: #8CB8F0;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1520; --surface: #162130; --surface-2: #1D2A3B; --ink: #E5EBF2; --muted: #9AA8B8; --rule: #2B3A4E;
  --navy: #9DBDE6; --navy-ink: #0E1520; --gold: #D5B16E; --gold-soft: #2D2717;
  --good: #6FCF9F; --good-soft: #15302A; --bad: #F0907F; --bad-soft: #3A1E1A; --focus: #8CB8F0;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
:root[data-size="l"] { --qscale: 1.2; }
:root[data-size="xl"] { --qscale: 1.45; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
p { margin: 0; }

.shell { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule); }
.topbar .shell { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; text-decoration: none; color: inherit; background: none; border: 0; padding: 0; }
.brand b { font-family: var(--f-display); font-weight: 700; color: var(--navy); font-size: 22px; letter-spacing: .08em; }
.brand span { font-size: 11px; letter-spacing: .22em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
.brand i { width: 1px; height: 18px; background: var(--rule); align-self: center; }
.topbar .grow { flex: 1; }
.lvl-chip { font-family: var(--f-display); font-weight: 600; font-size: 13px; color: var(--gold); background: var(--gold-soft); padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.tool { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.tool:hover { color: var(--ink); border-color: var(--muted); }

/* home */
.hero { padding-block: 36px 22px; display: grid; gap: 10px; }
.eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.hero h1 { font-size: clamp(30px, 4.6vw, 44px); color: var(--navy); font-weight: 600; letter-spacing: -.01em; }
.hero p { color: var(--muted); max-width: 62ch; font-size: 18px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; color: var(--muted); padding-top: 4px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-bottom: 18px; }
.mode { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; display: grid; gap: 4px; align-content: start; }
.mode h3 { font-size: 16px; font-weight: 600; color: var(--navy); }
.mode p { font-size: 15px; color: var(--muted); }
.mode.primary { background: var(--navy); border-color: var(--navy); text-align: left; }
.mode.primary h3, .mode.primary p { color: var(--navy-ink); }
.mode.primary p { opacity: .85; }
.mode.primary .go { color: var(--navy-ink); }
.go { font-weight: 700; font-size: 14px; color: var(--navy); margin-top: 6px; }

.guide { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; margin-bottom: 30px; }
.guide summary { list-style: none; padding: 14px 18px; display: flex; gap: 10px; align-items: center; font-weight: 700; color: var(--navy); cursor: pointer; }
.guide summary::-webkit-details-marker { display: none; }
.guide summary::after { content: "+"; margin-left: auto; font-size: 22px; line-height: 1; color: var(--muted); font-weight: 400; }
.guide[open] summary::after { content: "–"; }
.guide .body { padding: 0 18px 18px; display: grid; gap: 14px; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; counter-increment: s; }
.steps li::before { content: counter(s); font-family: var(--f-display); font-weight: 600; color: var(--gold); font-size: 15px; padding-top: 1px; }
.stage-key { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stage-key div { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
.stage-key b { display: block; color: var(--navy); font-size: 15px; }
.note { font-size: 15px; color: var(--muted); border-left: 3px solid var(--gold); padding: 2px 0 2px 12px; }

.unit { margin-bottom: 30px; }
.unit-head { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--navy); padding-bottom: 8px; margin-bottom: 4px; }
.unit-head .u { font-size: 12px; letter-spacing: .16em; font-weight: 700; color: var(--gold); text-transform: uppercase; }
.unit-head h2 { font-size: 21px; color: var(--navy); font-weight: 600; }
.unit-head .s { font-size: 14px; color: var(--muted); }
.unit-head .grow { flex: 1; }
.unit-btn { border: 1px solid var(--navy); color: var(--navy); background: transparent; border-radius: 8px; padding: 5px 12px; font-size: 14px; font-weight: 600; }
.unit-btn:hover { background: var(--navy); color: var(--navy-ink); }
.points { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; }
.pt { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 12px 4px; border-radius: 0; }
.pt:hover { background: var(--surface); }
.pt .n { font-family: var(--f-display); font-weight: 600; color: var(--muted); font-size: 17px; font-variant-numeric: tabular-nums; }
.pt .t { font-weight: 700; color: var(--ink); line-height: 1.3; }
.pt .c { display: block; font-size: 14px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.pt .arrow { color: var(--navy); font-weight: 700; font-size: 18px; }

footer { padding-block: 20px 40px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--rule); margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
footer a { color: var(--navy); font-weight: 600; }

/* check view */
.check { padding-block: 18px 40px; display: grid; gap: 14px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.back { background: none; border: 0; color: var(--navy); font-weight: 700; padding: 4px 0; }
.crumb-title { font-family: var(--f-display); font-weight: 600; color: var(--navy); font-size: 18px; min-width: 0; }
.crumb-title small { font-family: var(--f-body); font-weight: 700; color: var(--gold); letter-spacing: .12em; font-size: 12px; text-transform: uppercase; margin-right: 8px; }
.crumbs .grow { flex: 1; }
.progress { display: flex; gap: 4px; }
.progress span { flex: 1; height: 6px; border-radius: 3px; background: var(--rule); }
.progress span.ok { background: var(--good); }
.progress span.no { background: var(--bad); }
.progress span.cur { background: var(--navy); }
.progress span.sp { flex: 0 0 34px; }

.notes-btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: 14px; color: var(--muted); font-weight: 600; }
.notes-btn[aria-expanded="true"] { background: var(--gold-soft); color: var(--gold); border-color: transparent; }
.notes { background: var(--gold-soft); border-radius: 12px; padding: 16px 18px; display: grid; gap: 10px; grid-template-columns: 120px minmax(0, 1fr); font-size: 16px; }
.notes dt { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); padding-top: 3px; }
.notes dd { margin: 0; }

.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow); padding: clamp(20px, 4vw, 40px); display: grid; gap: 22px; }
.qhead { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.qtype { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--gold); }
.qnum { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qtext { font-family: var(--f-display); font-weight: 500; font-size: calc(clamp(24px, 1rem + 2.2vw, 38px) * var(--qscale)); line-height: 1.35; color: var(--ink); overflow-wrap: anywhere; }
.gap { display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--navy); text-align: center; padding: 0 .2em; line-height: 1.15; }
.gap.ok { color: var(--good); border-color: var(--good); }
.gap.no { color: var(--bad); border-color: var(--bad); text-decoration: line-through; }

.opts { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opts.sent { grid-template-columns: 1fr; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--surface-2); border: 2px solid transparent; border-radius: 12px; padding: 14px 16px; font-family: var(--f-display); font-size: calc(clamp(18px, .9rem + 1vw, 24px) * var(--qscale)); font-weight: 500; min-width: 0; }
.opt .k { flex: 0 0 auto; width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; font-size: .62em; font-weight: 600; background: var(--surface); color: var(--muted); border: 1px solid var(--rule); }
.opt .lbl { min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--navy); }
.opt:disabled { cursor: default; opacity: .55; }
.opt.right { background: var(--good-soft); border-color: var(--good); opacity: 1; }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); opacity: 1; }

.words { display: flex; flex-wrap: wrap; gap: .3em .25em; font-family: var(--f-display); font-weight: 500; font-size: calc(clamp(24px, 1rem + 2.2vw, 38px) * var(--qscale)); line-height: 1.4; }
.word { background: none; border: 0; border-bottom: 2px dotted var(--rule); border-radius: 4px; padding: 0 .12em; font-family: inherit; font-weight: inherit; font-size: inherit; }
.word:hover:not(:disabled) { background: var(--surface-2); border-bottom-color: var(--navy); }
.word:disabled { cursor: default; }
.word.bad { background: var(--good-soft); color: var(--good); border-bottom: 2px solid var(--good); }
.word.picked { background: var(--bad-soft); color: var(--bad); border-bottom: 2px solid var(--bad); text-decoration: line-through; }

.line { min-height: calc(64px * var(--qscale)); border: 2px dashed var(--rule); border-radius: 12px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.line.done-ok { border-style: solid; border-color: var(--good); background: var(--good-soft); }
.line.done-no { border-style: solid; border-color: var(--bad); background: var(--bad-soft); }
.line .placeholder { color: var(--muted); font-size: 15px; padding-left: 4px; }
.line .punct { font-family: var(--f-display); font-size: calc(clamp(18px, .9rem + 1vw, 24px) * var(--qscale)); color: var(--muted); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; }
.tile { background: var(--surface); border: 2px solid var(--navy); color: var(--navy); border-radius: 10px; padding: 8px 14px; font-family: var(--f-display); font-weight: 500; font-size: calc(clamp(18px, .9rem + 1vw, 24px) * var(--qscale)); }
.tile.used { visibility: hidden; }
.line .tile { background: var(--navy); color: var(--navy-ink); }
.line .tile:disabled { cursor: default; }
.order-tools { display: flex; gap: 10px; flex-wrap: wrap; }

.btn { border: 0; border-radius: 10px; padding: 12px 22px; font-weight: 700; font-size: 16px; background: var(--navy); color: var(--navy-ink); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { background: transparent; color: var(--navy); border: 1px solid var(--rule); }
.btn .kbd { font-weight: 400; opacity: .7; font-size: 13px; margin-left: 8px; }

.fb { border-radius: 12px; padding: 16px 18px; display: grid; gap: 6px; }
.fb.ok { background: var(--good-soft); }
.fb.no { background: var(--bad-soft); }
.fb .v { font-weight: 700; font-size: 18px; }
.fb.ok .v { color: var(--good); }
.fb.no .v { color: var(--bad); }
.fb .ans { font-family: var(--f-display); font-size: calc(19px * var(--qscale)); font-weight: 500; }
.fb .why { color: var(--muted); }
.fb .from { font-size: 14px; color: var(--muted); }
.next-row { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

/* speaking */
.speak .prompt { font-family: var(--f-display); font-weight: 500; font-size: calc(clamp(22px, 1rem + 1.8vw, 34px) * var(--qscale)); line-height: 1.35; }
.model { background: var(--surface-2); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
.model b { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.model p { font-family: var(--f-display); font-size: calc(19px * var(--qscale)); }
.listen { font-size: 15px; color: var(--muted); }
.listen b { color: var(--ink); }
.rate { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.rate button { border: 2px solid var(--rule); background: var(--surface); border-radius: 12px; padding: 14px; text-align: left; display: grid; gap: 2px; }
.rate button b { font-size: 16px; }
.rate button span { font-size: 14px; color: var(--muted); }
.rate button:hover { border-color: var(--navy); }
.rate .yes b { color: var(--good); }
.rate .partly b { color: var(--gold); }
.rate .no b { color: var(--bad); }

/* results */
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.score .big { font-family: var(--f-display); font-weight: 600; font-size: 56px; color: var(--navy); line-height: 1; font-variant-numeric: tabular-nums; }
.score .big small { font-size: 28px; color: var(--muted); font-weight: 500; }
.score .lbl { color: var(--muted); }
.stagebar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--rule); }
.stagebar div { padding: 10px 12px; font-weight: 700; font-size: 15px; color: var(--muted); background: var(--surface-2); border-right: 1px solid var(--rule); }
.stagebar div:last-child { border-right: 0; }
.stagebar div.on { background: var(--navy); color: var(--navy-ink); }
.stagebar div.on small { color: var(--navy-ink); opacity: .8; }
.stagebar small { display: block; font-weight: 400; font-size: 13px; }
.advice { font-size: 17px; }
.advice b { color: var(--navy); }
.review { list-style: none; margin: 0; padding: 0; display: grid; }
.review li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--rule); }
.review .mk { font-weight: 700; }
.review .mk.ok { color: var(--good); }
.review .mk.no { color: var(--bad); }
.review .gv { font-size: 14px; color: var(--muted); }
.review .pp { font-size: 13px; color: var(--muted); }
.section-label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--gold); }
.miss { display: grid; gap: 8px; }
.miss button { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; background: var(--bad-soft); border: 0; border-radius: 10px; padding: 10px 14px; }
.miss .n { font-family: var(--f-display); font-weight: 600; color: var(--bad); }
.miss .go2 { font-size: 14px; font-weight: 700; color: var(--navy); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { background: var(--good-soft); color: var(--good); border-radius: 99px; padding: 3px 10px; font-size: 14px; font-weight: 600; }
.caution { font-size: 14px; color: var(--muted); }

@media (max-width: 760px) {
  .modes { grid-template-columns: 1fr; }
  .points { grid-template-columns: 1fr; }
  .opts { grid-template-columns: 1fr; }
  .rate { grid-template-columns: 1fr; }
  .stage-key { grid-template-columns: 1fr; }
  .notes { grid-template-columns: 1fr; gap: 2px; }
  .notes dd { margin-bottom: 8px; }
  .brand span, .brand i, .tool.fs { display: none; }
  .brand { flex: 0 0 auto; }
  .stagebar small { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
</style>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
