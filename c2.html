<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LLI C2 Grammar Quick Checks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: a single centred working column, like a teacher's clipboard. Home = units as numbered session rows; check = one large question card for projection. */
:root {
  --bg: #F4F6F9;
  --surface: #FFFFFF;
  --surface-2: #EEF2F6;
  --ink: #1B2734;
  --muted: #5B6878;
  --rule: #D5DCE4;
  --navy: #1F3A5F;
  --navy-ink: #FFFFFF;
  --gold: #8A6A2E;
  --gold-soft: #F3EBDD;
  --good: #23704F;
  --good-soft: #E3F2EA;
  --bad: #A8402F;
  --bad-soft: #F8E7E3;
  --focus: #2F6DB5;
  --shadow: 0 1px 2px rgba(20,35,55,.06), 0 6px 20px rgba(20,35,55,.06);
  --f-display: "Lexend", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --qscale: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1520; --surface: #162130; --surface-2: #1D2A3B; --ink: #E5EBF2; --muted: #9AA8B8; --rule: #2B3A4E;
    --navy: #9DBDE6; --navy-ink: #0E1520; --gold: #D5B16E; --gold-soft: #2D2717;
    --good: #6FCF9F; --good-soft: #15302A; --bad: #F0907F; --bad-soft: #3A1E1A; --focus: #8CB8F0;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1520; --surface: #162130; --surface-2: #1D2A3B; --ink: #E5EBF2; --muted: #9AA8B8; --rule: #2B3A4E;
  --navy: #9DBDE6; --navy-ink: #0E1520; --gold: #D5B16E; --gold-soft: #2D2717;
  --good: #6FCF9F; --good-soft: #15302A; --bad: #F0907F; --bad-soft: #3A1E1A; --focus: #8CB8F0;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
:root[data-size="l"] { --qscale: 1.2; }
:root[data-size="xl"] { --qscale: 1.45; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
p { margin: 0; }

.shell { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule); }
.topbar .shell { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; text-decoration: none; color: inherit; background: none; border: 0; padding: 0; }
.brand b { font-family: var(--f-display); font-weight: 700; color: var(--navy); font-size: 22px; letter-spacing: .08em; }
.brand span { font-size: 11px; letter-spacing: .22em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
.brand i { width: 1px; height: 18px; background: var(--rule); align-self: center; }
.topbar .grow { flex: 1; }
.lvl-chip { font-family: var(--f-display); font-weight: 600; font-size: 13px; color: var(--gold); background: var(--gold-soft); padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.tool { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.tool:hover { color: var(--ink); border-color: var(--muted); }

/* home */
.hero { padding-block: 36px 22px; display: grid; gap: 10px; }
.eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.hero h1 { font-size: clamp(30px, 4.6vw, 44px); color: var(--navy); font-weight: 600; letter-spacing: -.01em; }
.hero p { color: var(--muted); max-width: 62ch; font-size: 18px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; color: var(--muted); padding-top: 4px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-bottom: 18px; }
.mode { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; display: grid; gap: 4px; align-content: start; }
.mode h3 { font-size: 16px; font-weight: 600; color: var(--navy); }
.mode p { font-size: 15px; color: var(--muted); }
.mode.primary { background: var(--navy); border-color: var(--navy); text-align: left; }
.mode.primary h3, .mode.primary p { color: var(--navy-ink); }
.mode.primary p { opacity: .85; }
.mode.primary .go { color: var(--navy-ink); }
.go { font-weight: 700; font-size: 14px; color: var(--navy); margin-top: 6px; }

.guide { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; margin-bottom: 30px; }
.guide summary { list-style: none; padding: 14px 18px; display: flex; gap: 10px; align-items: center; font-weight: 700; color: var(--navy); cursor: pointer; }
.guide summary::-webkit-details-marker { display: none; }
.guide summary::after { content: "+"; margin-left: auto; font-size: 22px; line-height: 1; color: var(--muted); font-weight: 400; }
.guide[open] summary::after { content: "–"; }
.guide .body { padding: 0 18px 18px; display: grid; gap: 14px; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; counter-increment: s; }
.steps li::before { content: counter(s); font-family: var(--f-display); font-weight: 600; color: var(--gold); font-size: 15px; padding-top: 1px; }
.stage-key { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stage-key div { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
.stage-key b { display: block; color: var(--navy); font-size: 15px; }
.note { font-size: 15px; color: var(--muted); border-left: 3px solid var(--gold); padding: 2px 0 2px 12px; }

.unit { margin-bottom: 30px; }
.unit-head { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--navy); padding-bottom: 8px; margin-bottom: 4px; }
.unit-head .u { font-size: 12px; letter-spacing: .16em; font-weight: 700; color: var(--gold); text-transform: uppercase; }
.unit-head h2 { font-size: 21px; color: var(--navy); font-weight: 600; }
.unit-head .s { font-size: 14px; color: var(--muted); }
.unit-head .grow { flex: 1; }
.unit-btn { border: 1px solid var(--navy); color: var(--navy); background: transparent; border-radius: 8px; padding: 5px 12px; font-size: 14px; font-weight: 600; }
.unit-btn:hover { background: var(--navy); color: var(--navy-ink); }
.points { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; }
.pt { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 12px 4px; border-radius: 0; }
.pt:hover { background: var(--surface); }
.pt .n { font-family: var(--f-display); font-weight: 600; color: var(--muted); font-size: 17px; font-variant-numeric: tabular-nums; }
.pt .t { font-weight: 700; color: var(--ink); line-height: 1.3; }
.pt .c { display: block; font-size: 14px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.pt .arrow { color: var(--navy); font-weight: 700; font-size: 18px; }

footer { padding-block: 20px 40px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--rule); margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
footer a { color: var(--navy); font-weight: 600; }

/* check view */
.check { padding-block: 18px 40px; display: grid; gap: 14px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.back { background: none; border: 0; color: var(--navy); font-weight: 700; padding: 4px 0; }
.crumb-title { font-family: var(--f-display); font-weight: 600; color: var(--navy); font-size: 18px; min-width: 0; }
.crumb-title small { font-family: var(--f-body); font-weight: 700; color: var(--gold); letter-spacing: .12em; font-size: 12px; text-transform: uppercase; margin-right: 8px; }
.crumbs .grow { flex: 1; }
.progress { display: flex; gap: 4px; }
.progress span { flex: 1; height: 6px; border-radius: 3px; background: var(--rule); }
.progress span.ok { background: var(--good); }
.progress span.no { background: var(--bad); }
.progress span.cur { background: var(--navy); }
.progress span.sp { flex: 0 0 34px; }

.notes-btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: 14px; color: var(--muted); font-weight: 600; }
.notes-btn[aria-expanded="true"] { background: var(--gold-soft); color: var(--gold); border-color: transparent; }
.notes { background: var(--gold-soft); border-radius: 12px; padding: 16px 18px; display: grid; gap: 10px; grid-template-columns: 120px minmax(0, 1fr); font-size: 16px; }
.notes dt { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); padding-top: 3px; }
.notes dd { margin: 0; }

.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow); padding: clamp(20px, 4vw, 40px); display: grid; gap: 22px; }
.qhead { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.qtype { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--gold); }
.qnum { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qtext { font-family: var(--f-display); font-weight: 500; font-size: calc(clamp(24px, 1rem + 2.2vw, 38px) * var(--qscale)); line-height: 1.35; color: var(--ink); overflow-wrap: anywhere; }
.gap { display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--navy); text-align: center; padding: 0 .2em; line-height: 1.15; }
.gap.ok { color: var(--good); border-color: var(--good); }
.gap.no { color: var(--bad); border-color: var(--bad); text-decoration: line-through; }

.opts { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opts.sent { grid-template-columns: 1fr; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--surface-2); border: 2px solid transparent; border-radius: 12px; padding: 14px 16px; font-family: var(--f-display); font-size: calc(clamp(18px, .9rem + 1vw, 24px) * var(--qscale)); font-weight: 500; min-width: 0; }
.opt .k { flex: 0 0 auto; width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; font-size: .62em; font-weight: 600; background: var(--surface); color: var(--muted); border: 1px solid var(--rule); }
.opt .lbl { min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--navy); }
.opt:disabled { cursor: default; opacity: .55; }
.opt.right { background: var(--good-soft); border-color: var(--good); opacity: 1; }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); opacity: 1; }

.words { display: flex; flex-wrap: wrap; gap: .3em .25em; font-family: var(--f-display); font-weight: 500; font-size: calc(clamp(24px, 1rem + 2.2vw, 38px) * var(--qscale)); line-height: 1.4; }
.word { background: none; border: 0; border-bottom: 2px dotted var(--rule); border-radius: 4px; padding: 0 .12em; font-family: inherit; font-weight: inherit; font-size: inherit; }
.word:hover:not(:disabled) { background: var(--surface-2); border-bottom-color: var(--navy); }
.word:disabled { cursor: default; }
.word.bad { background: var(--good-soft); color: var(--good); border-bottom: 2px solid var(--good); }
.word.picked { background: var(--bad-soft); color: var(--bad); border-bottom: 2px solid var(--bad); text-decoration: line-through; }

.line { min-height: calc(64px * var(--qscale)); border: 2px dashed var(--rule); border-radius: 12px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.line.done-ok { border-style: solid; border-color: var(--good); background: var(--good-soft); }
.line.done-no { border-style: solid; border-color: var(--bad); background: var(--bad-soft); }
.line .placeholder { color: var(--muted); font-size: 15px; padding-left: 4px; }
.line .punct { font-family: var(--f-display); font-size: calc(clamp(18px, .9rem + 1vw, 24px) * var(--qscale)); color: var(--muted); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; }
.tile { background: var(--surface); border: 2px solid var(--navy); color: var(--navy); border-radius: 10px; padding: 8px 14px; font-family: var(--f-display); font-weight: 500; font-size: calc(clamp(18px, .9rem + 1vw, 24px) * var(--qscale)); }
.tile.used { visibility: hidden; }
.line .tile { background: var(--navy); color: var(--navy-ink); }
.line .tile:disabled { cursor: default; }
.order-tools { display: flex; gap: 10px; flex-wrap: wrap; }

.btn { border: 0; border-radius: 10px; padding: 12px 22px; font-weight: 700; font-size: 16px; background: var(--navy); color: var(--navy-ink); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { background: transparent; color: var(--navy); border: 1px solid var(--rule); }
.btn .kbd { font-weight: 400; opacity: .7; font-size: 13px; margin-left: 8px; }

.fb { border-radius: 12px; padding: 16px 18px; display: grid; gap: 6px; }
.fb.ok { background: var(--good-soft); }
.fb.no { background: var(--bad-soft); }
.fb .v { font-weight: 700; font-size: 18px; }
.fb.ok .v { color: var(--good); }
.fb.no .v { color: var(--bad); }
.fb .ans { font-family: var(--f-display); font-size: calc(19px * var(--qscale)); font-weight: 500; }
.fb .why { color: var(--muted); }
.fb .from { font-size: 14px; color: var(--muted); }
.next-row { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

/* speaking */
.speak .prompt { font-family: var(--f-display); font-weight: 500; font-size: calc(clamp(22px, 1rem + 1.8vw, 34px) * var(--qscale)); line-height: 1.35; }
.model { background: var(--surface-2); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
.model b { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.model p { font-family: var(--f-display); font-size: calc(19px * var(--qscale)); }
.listen { font-size: 15px; color: var(--muted); }
.listen b { color: var(--ink); }
.rate { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.rate button { border: 2px solid var(--rule); background: var(--surface); border-radius: 12px; padding: 14px; text-align: left; display: grid; gap: 2px; }
.rate button b { font-size: 16px; }
.rate button span { font-size: 14px; color: var(--muted); }
.rate button:hover { border-color: var(--navy); }
.rate .yes b { color: var(--good); }
.rate .partly b { color: var(--gold); }
.rate .no b { color: var(--bad); }

/* results */
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.score .big { font-family: var(--f-display); font-weight: 600; font-size: 56px; color: var(--navy); line-height: 1; font-variant-numeric: tabular-nums; }
.score .big small { font-size: 28px; color: var(--muted); font-weight: 500; }
.score .lbl { color: var(--muted); }
.stagebar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--rule); }
.stagebar div { padding: 10px 12px; font-weight: 700; font-size: 15px; color: var(--muted); background: var(--surface-2); border-right: 1px solid var(--rule); }
.stagebar div:last-child { border-right: 0; }
.stagebar div.on { background: var(--navy); color: var(--navy-ink); }
.stagebar div.on small { color: var(--navy-ink); opacity: .8; }
.stagebar small { display: block; font-weight: 400; font-size: 13px; }
.advice { font-size: 17px; }
.advice b { color: var(--navy); }
.review { list-style: none; margin: 0; padding: 0; display: grid; }
.review li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--rule); }
.review .mk { font-weight: 700; }
.review .mk.ok { color: var(--good); }
.review .mk.no { color: var(--bad); }
.review .gv { font-size: 14px; color: var(--muted); }
.review .pp { font-size: 13px; color: var(--muted); }
.section-label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--gold); }
.miss { display: grid; gap: 8px; }
.miss button { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; background: var(--bad-soft); border: 0; border-radius: 10px; padding: 10px 14px; }
.miss .n { font-family: var(--f-display); font-weight: 600; color: var(--bad); }
.miss .go2 { font-size: 14px; font-weight: 700; color: var(--navy); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { background: var(--good-soft); color: var(--good); border-radius: 99px; padding: 3px 10px; font-size: 14px; font-weight: 600; }
.caution { font-size: 14px; color: var(--muted); }

@media (max-width: 760px) {
  .modes { grid-template-columns: 1fr; }
  .points { grid-template-columns: 1fr; }
  .opts { grid-template-columns: 1fr; }
  .rate { grid-template-columns: 1fr; }
  .stage-key { grid-template-columns: 1fr; }
  .notes { grid-template-columns: 1fr; gap: 2px; }
  .notes dd { margin-bottom: 8px; }
  .brand span, .brand i, .tool.fs { display: none; }
  .brand { flex: 0 0 auto; }
  .stagebar small { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
</style>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<body>
<header class="topbar">
  <div class="shell">
    <button class="brand" data-act="home" aria-label="LLI Lexilink Ideation — back to all points"><b>LLI</b><i></i><span>Lexilink Ideation</span></button>
    <span class="lvl-chip" id="lvlChip"></span>
    <div class="grow"></div>
    <button class="tool" id="sizeBtn" data-act="size" title="Change question text size">Text size: M</button>
    <button class="tool fs" data-act="full" title="Full screen for projecting">Full screen</button>
  </div>
</header>
<main id="app"></main>

<script>
const L = {"code":"C2","name":"Mastery","next":null,"units":[{"n":"Nuance in form","p":[{"t":"Tense and aspect for subtle meaning","c":"I can exploit tense and aspect to convey relevance, attitude and tentativeness.","ex":"The Prime Minister has resigned. I was hoping you might …","w":"","r":"Choose tense and aspect for meaning, not just time: present perfect for news and present relevance (The Prime Minister has resigned); continuous for annoyance or tentativeness (He's always leaving…, I've been meaning to…); past perfect for an earlier viewpoint.","tip":"Give pairs (I've lived / I lived here for ten years). Students explain exactly what each one implies.","q":[["c",["I've lived here for ten years. (I still do.)","I lived here for ten years. (I still do.)","I'm living here for ten years. (I still do.)"],"Still true → present perfect."],["c",["Breaking news: the Prime Minister has resigned.","Breaking news: the Prime Minister resigned since an hour.","Breaking news: the Prime Minister had resigned."],"Fresh news with present relevance → present perfect."],["g","___ you be needing anything else? (a polite waiter)",["Will","Do","Are"],"Will you be + -ing is a polite, indirect way to ask."],["g","I've been ___ to ask you something.",["meaning","meant","mean"]],["g","He's ___ leaving his things on the floor! (annoyed)",["always","ever","never once"],"always + continuous expresses annoyance."],["g","By the time she was thirty, she ___ in five countries.",["had lived","lived","has lived"]],["e","Look — someone *ate* my sandwich! It's gone.","Look — someone has eaten my sandwich! It's gone.","A past action with a present result → present perfect."],["o","I have been meaning to call you","."]],"s":[["Explain the difference: \"She was always helping people\" vs \"She always helped people.\"","The continuous presents helping as a striking, characteristic habit; the simple just states a fact."],["Report the same event twice — as a news item and as the opening of a story — choosing tenses deliberately.","Firefighters have rescued a family from a burning flat. / It was just after midnight when the smoke began to rise…"]]},{"t":"Fine modal distinctions","c":"I can use putative should, legal shall and characteristic would with precision.","ex":"It's odd that he should say that. The tenant shall pay …","w":"","r":"Putative should for reactions and surprise (It's odd that he should say that). shall for legal or formal obligation (The tenant shall pay…). would for typical behaviour (He would say that — typical!).","tip":"Students write rental-contract clauses with shall and react to surprising news with It's strange that … should….","q":[["g","It's strange that he ___ refuse such a good offer.",["should","shall","must"],"Reaction to a fact → putative should."],["g","The tenant ___ pay rent on the first day of each month.",["shall","should to","would"],"Legal obligation → shall."],["g","\"He says it wasn't his fault.\" — \"Well, he ___ say that, wouldn't he?\"",["would","should","shall"],"That's typical of him → would."],["g","I'm surprised that she ___ have left without saying goodbye.",["should","shall","must"]],["g","It is only natural that parents ___ worry about their children.",["should","shall","would to"]],["c",["The contractor shall complete all work by 1 June.","The contractor shall to complete all work by 1 June.","The contractor shall completes all work by 1 June."]],["e","It's a shame that you *shall* feel that way.","It's a shame that you should feel that way.","Emotional reaction → putative should."],["o","How should I know","?"]],"s":[["React to surprising news using It's odd / surprising / a pity that … should….","It's surprising that the company should cut jobs after such a good year."],["Draft three clauses for a flat-rental agreement using shall.","The tenant shall keep the property clean. The landlord shall repair any faults within seven days."]]},{"t":"Subjunctive and formulaic expressions","c":"I can use fixed subjunctive forms naturally.","ex":"Be that as it may, … Come what may, … Were he to resign, …","w":"","r":"Fixed subjunctive expressions: Be that as it may, Come what may, Suffice it to say, So be it, If need be, Far be it from me to… Inverted subjunctive: Were he to resign, …","tip":"Students use one formulaic expression in each turn of a short debate.","q":[["g","___ that as it may, we still need a decision.",["Be","Is","Being"]],["g","Come what ___, I'll support you.",["may","might","will"]],["g","___ it to say, the meeting did not go well.",["Suffice","Sufficient","Suffices"]],["g","___ he to resign, the party would be in trouble.",["Were","Was","Would"]],["g","I'll work all night if need ___.",["be","is","being"]],["g","Far ___ it from me to criticise, but this report is late.",["be","is","being"]],["c",["If that is your decision, so be it.","If that is your decision, so is it.","If that is your decision, be it so."]],["e","Be that as it *might*, the decision is final.","Be that as it may, the decision is final.","Fixed expression: Be that as it may."]],"s":[["Respond to objections in a meeting using Be that as it may and Suffice it to say.","Be that as it may, the budget cannot be increased. Suffice it to say, I'm disappointed."],["State your determination using Come what may and If need be.","Come what may, I'll finish this degree, and I'll work weekends if need be."]]},{"t":"Complex hypothetical structures","c":"I can combine inversion, mixed time and modality in hypothetical meaning.","ex":"Were it not for her intervention, the project would have collapsed.","w":"","r":"Combine inversion, mixed time and modality: Were it not for her intervention, the project would have collapsed. Had it not been for…, we would now be… Were you to be offered…, would you…?","tip":"Students rewrite \"what if\" sentences about history in formal, inverted forms.","q":[["g","___ it not for her intervention, the project would have collapsed.",["Were","Had","Should"]],["g","Had the treaty not been signed, Europe ___ very different today.",["would be","would have been","will be"],"today → would + verb (mixed conditional)."],["g","Were you ___ the job, would you take it?",["to be offered","offered","being offer"]],["g","___ it not been for the rain, we would be at the beach now.",["Had","Were","Should"]],["g","If I had been born a century ago, I ___ never have travelled abroad.",["would probably","will probably","probably would to"]],["c",["Were the plan to fail, who would take responsibility?","Were the plan fail, who would take responsibility?","Was the plan to fail, who will take responsibility?"]],["c",["But for the invention of printing, literacy would have remained rare.","But for printing was invented, literacy would have remained rare.","But for the invention of printing, literacy would remain rare then."]],["e","*Hadn't* it been for his warning, we would have been caught.","Had it not been for his warning, we would have been caught.","Inverted negative: Had it not been…"]],"s":[["Speculate about a turning point in history using Had it not been for… and Were it not for….","Had it not been for the printing press, ideas would have spread far more slowly."],["Pose a dilemma to your partner using Were you to…, would you…?","Were you to be offered a job abroad, would you accept it even if it meant leaving your family?"]]},{"t":"Literary and rhetorical inversion","c":"I can use inversion after so, such and adverbials of place for effect.","ex":"So great was the demand that … Down came the rain.","w":"","r":"Inversion after so / such (So great was the demand that…; Such was his anger that…) and after adverbials of place or direction with a noun subject (Down came the rain. Into the room walked a stranger.). With a pronoun, don't invert: Out he ran.","tip":"Students rewrite a plain story extract with two or three dramatic inversions.","q":[["g","So great ___ the demand that tickets sold out in minutes.",["was","did","it was"]],["g","Such ___ his anger that he couldn't speak.",["was","did","it was"]],["g","Down ___ the rain.",["came","did come","coming"]],["g","Into the room ___ a tall stranger.",["walked","did walk","walking"]],["g","Here ___ the bus!",["comes","does come","coming"]],["c",["Such was the noise that nobody could sleep.","Such the noise was that nobody could sleep.","So was the noise that nobody could sleep."]],["e","So difficult *the_exam_was* that half the class failed.","So difficult was the exam that half the class failed.","So + adjective at the front → invert."],["o","On the hill stood an old castle","."]],"s":[["Describe a dramatic scene using a place inversion and a So … that inversion.","Up went the curtain, and so loud was the applause that the actors couldn't begin."],["Rewrite: \"The crowd was so excited that they rushed the stage.\" \"A huge dog came round the corner.\"","So excited was the crowd that they rushed the stage. Round the corner came a huge dog."]]}]},{"n":"Discourse and argument","p":[{"t":"Information structure: end-weight, end-focus, extraposition","c":"I can order information so that the key point lands where I want it.","ex":"It is surprising that so few people noticed.","w":"","r":"Put known information first and new or long information at the end (end-focus, end-weight). Move long subjects to the end with it (extraposition): It is surprising that so few people noticed.","tip":"Give sentences with very long subjects. Students restructure them with extraposition.","q":[["c",["It is surprising that so few people noticed.","That so few people noticed is surprising it.","Is surprising that so few people noticed."],"Long subject → move it to the end with it."],["g","___ is essential that all staff attend.",["It","This","There"]],["g","It came as a shock ___ he had resigned.",["that","what","which"]],["g","I find ___ hard to believe that nobody saw anything.",["it","this","(no word)"]],["g","It's a pity ___ you can't come.",["that","what","it"]],["g","It is widely believed ___ the economy will recover.",["that","what","which"]],["e","To learn that the factory would close *it_was* a shock to everyone.","It was a shock to everyone to learn that the factory would close.","Extraposition: It was a shock … to learn…"],["o","It is unclear whether the plan will work","."]],"s":[["Rewrite with extraposition: \"That the government ignored the report is shocking.\" \"To finish by Friday will be difficult.\"","It is shocking that the government ignored the report. It will be difficult to finish by Friday."],["Tell a short piece of news, saving the most important new information for the end.","Last night, after months of negotiations, the two companies finally agreed to merge."]]},{"t":"Cohesion across extended text","c":"I can maintain clear reference chains, ellipsis and substitution over long texts.","ex":"","w":"","r":"Keep reference clear in long texts: each pronoun needs one clear antecedent. Use summary nouns (This decision…), such + noun, the former / the latter, or repeat the noun when a pronoun would be ambiguous.","tip":"Students find unclear pronouns in a paragraph and rewrite so every reference is clear.","q":[["g","The council approved the plan in May. ___ decision surprised residents.",["This","A","Such"]],["g","Several solutions were proposed. None of ___ was adopted.",["them","it","which"]],["g","Smoking and drinking are both harmful; ___ is the leading cause of preventable death.",["the former","the first","former"]],["g","He promised to resign. ___ a promise was hard to believe.",["Such","So","This a"]],["c",["When Tom met Peter, Tom was nervous. (It must be clear who was nervous.)","When Tom met Peter, he was nervous. (It must be clear who was nervous.)","When Tom met Peter, him was nervous. (It must be clear who was nervous.)"],"he could mean Tom or Peter → repeat the name."],["c",["The company cut prices and increased advertising. These measures boosted sales.","The company cut prices and increased advertising. This measures boosted sales.","The company cut prices and increased advertising. It boosted sales them."]],["e","Researchers interviewed the patients after treatment. *They* reported feeling much better.","Researchers interviewed the patients after treatment. The patients reported feeling much better.","They could mean the researchers → repeat the noun."],["o","These two factors are closely connected","."]],"s":[["Summarise a film or book in four sentences, linking each sentence clearly to the one before.","A young lawyer takes on a hopeless case. This decision costs him his career. Such sacrifices…"],["Explain an argument in five sentences using the former / the latter, such + noun and this + summary noun.","There are two options: renting or buying. The former offers flexibility; the latter offers security. This choice depends on…"]]},{"t":"High-level concession and contrast","c":"I can use however much, try as I might, much as, for all that.","ex":"Try as I might, I couldn't persuade them.","w":"","r":"However + adjective / adverb + clause (However hard I try…), Try as I might, Much as…, For all (= despite: For all his money…), Whatever / Wherever + clause.","tip":"Students describe frustrating situations using However hard…, Try as I might… and For all his….","q":[["g","___ hard I try, I can't understand it.",["However","Although","Despite"]],["g","Try as I ___, I couldn't persuade them.",["might","could","may"]],["g","For all ___ money, he isn't happy.",["his","he has","of his"]],["g","___ you go, you'll find people who speak English.",["Wherever","However","Whenever you"]],["g","___ I admire her work, I can't support this decision.",["Much as","As much","So much as"]],["g","___ the problems, the event was a success. (formal)",["For all","However","Try as"]],["c",["However tired you are, you must finish this.","However you are tired, you must finish this.","How tired you are, you must finish this."],"However + adjective + subject + verb."],["e","For all *he_is* efforts, the project failed.","For all his efforts, the project failed.","For all + noun phrase."]],"s":[["Describe a frustrating experience using However hard…, Try as I might… and For all….","Try as I might, I couldn't get the visa. For all my preparation, they rejected it."],["Give advice that holds in all cases using Whatever / Wherever / However….","Wherever you travel, learn a few words of the language. However busy you are, make time for sleep."]]},{"t":"Hedging, boosting and stance","c":"I can calibrate certainty and commitment exactly as intended.","ex":"This is, at best, a partial explanation.","w":"","r":"Hedge (may, arguably, at best, to some extent) or boost (clearly, undoubtedly, it is beyond doubt that) to show exactly how certain you are. Stance adverbs (admittedly, inevitably, regrettably) show your attitude. Don't mix a hedge and a booster on the same claim.","tip":"Students rewrite one claim three times: boosted, neutral and carefully hedged.","q":[["g","This is, at ___, a partial explanation.",["best","most","least good"]],["g","It is beyond ___ that the climate is changing.",["doubt","doubting","doubtful"]],["g","___, the changes will cost jobs — there is no way to avoid this.",["Inevitably","Arguably","Presumably"]],["g","___, we were unable to meet the deadline. We apologise.",["Regrettably","Arguably","Undoubtedly"]],["g","The policy has, to some ___, been successful.",["extent","part","way"]],["c",["The evidence strongly suggests that the drug is effective.","The evidence strongly proves maybe that the drug is effective.","The evidence suggests strongly maybe the drug effective."]],["e","This *undoubtedly_might* be the best solution.","This may well be the best solution.","Don't mix a booster (undoubtedly) with a hedge (might)."],["o","This is clearly the most important factor","."]],"s":[["Make one claim three ways — boosted, neutral and hedged — about online learning.","Online learning is undoubtedly the future. / Online learning is becoming more common. / Online learning may, to some extent, suit certain learners better."],["Write a formal apology and a statement of certainty using regrettably and beyond doubt.","Regrettably, your order has been delayed. It is beyond doubt that the fault was ours."]]},{"t":"Rhetorical grammar","c":"I can use parallelism, tricolon and rhetorical questions purposefully.","ex":"We came to listen, to learn and to act.","w":"Faulty parallelism: to listen, learning and act.","r":"Use parallel structures (the same grammatical form in a list), tricolon (groups of three), contrast pairs and rhetorical questions for persuasive effect. Keep lists parallel: to listen, to learn and to act.","tip":"Students analyse a famous speech extract for parallelism, then write a three-part slogan for the school.","q":[["c",["We came to listen, to learn and to act.","We came to listen, learning and act.","We came listening, to learn and acting."],"Parallel forms: to + verb each time."],["c",["She is clever, kind and hard-working.","She is clever, kind and works hard always.","She is clever, has kindness and hard-working."],"Parallel forms: three adjectives."],["g","We chose this path not because it is easy, but because it ___ hard.",["is","was being","being"]],["g","We need fewer words and more ___.",["action","act","acting more"]],["g","Ask not what your team can do for you; ask what you can ___ for your team.",["do","doing","done"]],["g","It's not about winning; it's about ___.",["taking part","take part","to taking part"],"Parallel with winning → -ing."],["e","The course will help you to think clearly, to write well and *speaking* confidently.","The course will help you to think clearly, to write well and to speak confidently.","Keep the list parallel: to think, to write, to speak."],["o","Why should we accept this","?"]],"s":[["Write a three-part persuasive slogan for your school or company using parallel structure.","Learn boldly, think freely, act responsibly."],["Persuade the class to protect a local park using a rhetorical question and a tricolon.","Do we really want concrete where children play? Let's protect it, preserve it and enjoy it."]]}]},{"n":"Complex structures","p":[{"t":"Multi-clause sentences with embedding","c":"I can construct long, embedded sentences that remain clear.","ex":"","w":"Losing the main verb in a long sentence.","r":"Long sentences stay clear when the main subject and verb are easy to find. Keep the main verb close to its subject where possible, and check agreement with the head noun after long interruptions.","tip":"Students underline the main subject and verb in long newspaper sentences, then build their own in stages.","q":[["g","The report, which was published last week after months of delays caused by funding problems, ___ several errors.",["contains","contain","containing"],"Main subject = the report (singular)."],["g","What the committee, after long discussions, finally ___ was to postpone the decision.",["decided","deciding","decide"]],["g","Anyone who thinks that the problems the company faces can be solved quickly ___ mistaken.",["is","are","being"],"Main subject = anyone (singular)."],["g","The students whose essays the examiners had praised ___ invited to a ceremony.",["were","was","being"]],["c",["The fact that the plan, which many experts had criticised, was approved surprised everyone.","The fact that the plan, which many experts had criticised, was approved it surprised everyone.","The fact the plan which many experts had criticised was approved surprising everyone."]],["c",["Although the results, which arrived late, were disappointing, the team remained optimistic.","Although the results, which arrived late, were disappointing, but the team remained optimistic.","Although the results, which arrived late, were disappointing the team, remained optimistic."]],["e","The list of changes that the new manager, who joined in March, introduced *were* impressive.","The list of changes that the new manager, who joined in March, introduced was impressive.","Head noun = list (singular)."],["o","The man who sold us the car has disappeared","."]],"s":[["Combine into one clear sentence: \"The museum opened in 2010. A famous architect designed it. It attracts a million visitors a year. Many come from abroad.\"","The museum, which was designed by a famous architect and opened in 2010, attracts a million visitors a year, many of whom come from abroad."],["Describe your job or studies in one long, well-controlled sentence, then in three short ones.","The course I'm taking, which combines economics with data science, is demanding but useful. / I'm taking a course. It combines economics with data science. It's demanding but useful."]]},{"t":"Packing and unpacking information density","c":"I can move between dense nominal style and clear verbal style for different audiences.","ex":"","w":"","r":"Dense style packs ideas into noun phrases (The rapid decline in bee populations threatens food production). Clear style unpacks them into clauses (Bees are disappearing fast, and this threatens our food). Choose the density for the audience.","tip":"Students rewrite an academic abstract for teenagers, then turn a chatty paragraph into an academic summary.","q":[["g","Unpacked: \"Bees are disappearing quickly.\" → Packed: \"The rapid ___ of bees…\"",["disappearance","disappearing","disappear"]],["g","Packed: \"Increased screen time reduces sleep quality.\" → Unpacked: \"When people ___ more time on screens, they sleep less well.\"",["spend","spending","spent it"]],["g","Packed: \"Following the introduction of the tax…\" → Unpacked: \"After the government ___ the tax…\"",["introduced","introduction","introducing"]],["g","Packed: \"the government's failure to act\" → Unpacked: \"the government ___ to act\"",["failed","failure","failing to"]],["c",["Rising sea levels pose a significant threat to coastal communities. (academic report)","Sea levels are rising and so coastal towns are, you know, kind of in trouble. (academic report)","Sea levels rise, which is threat to coastal communities. (academic report)"]],["c",["When it's hot, plants lose water through their leaves. (for children)","Elevated temperatures accelerate foliar transpiration. (for children)","The acceleration of transpiration in plants under heat. (for children)"],"For children → unpack into simple clauses."],["e","For a general audience: The *implementation_of_the_utilisation* of solar energy increased.","More people started using solar power.","Too dense for a general audience → unpack."],["o","The closure of the factory led to widespread unemployment","."]],"s":[["Unpack this for a 12-year-old: \"Excessive sugar consumption contributes to the development of obesity.\"","If you eat too much sugar, you're more likely to put on a lot of weight."],["Pack this into one formal sentence: \"Lots of young people moved to the city, so rents went up, and many older residents had to leave.\"","The influx of young people into the city drove up rents, forcing many older residents out."]]},{"t":"Absolute and complex non-finite clauses","c":"I can use absolute constructions and complex non-finite clauses.","ex":"The meeting over, we left. With prices rising, many families struggled.","w":"","r":"Absolute clauses have their own subject plus a participle (or no verb): The meeting over, we left. With prices rising, families struggled. His hands shaking, he opened the letter. Fixed: all things considered, weather permitting.","tip":"Students describe a tense moment using absolute clauses: \"Her heart pounding, she…\"","q":[["g","The meeting ___, we went home.",["over","finishing","was over"],"Absolute clause with no verb."],["g","With prices ___, many families are struggling.",["rising","rose","rise"]],["g","His hands ___, he opened the envelope.",["shaking","shook","shake"]],["g","All things ___, it was a successful year.",["considered","considering","consider"]],["g","Weather ___, the event will take place outdoors.",["permitting","permitted","permits"]],["c",["The work finished, they went home.","The work finished, went home they.","The work finishing, they gone home."]],["c",["Other things being equal, prices should fall.","Other things are equal, prices should fall.","Other things be equal, prices should fall."]],["e","Her eyes *fill* with tears, she said goodbye.","Her eyes filling with tears, she said goodbye.","Absolute clause → participle (filling)."]],"s":[["Describe a dramatic moment in a story using two absolute clauses.","Her heart pounding, she opened the door. The room empty, she stepped inside."],["Describe the current situation in your city or country starting With … -ing.","With rents rising and wages flat, many young people are moving home."]]},{"t":"Advanced comparative and correlative structures","c":"I can use no more … than, as much … as, the less … the less.","ex":"He is no more a criminal than I am.","w":"","r":"no more … than (= equally not: He is no more a criminal than I am). no less … than (= equally). more X than Y comparing qualities (more angry than sad). not so much X as Y. as much … as.","tip":"Students defend someone (\"He is no more to blame than…\") and describe mixed feelings (\"more relieved than happy\").","q":[["g","He is no ___ a criminal than I am.",["more","less","better"]],["g","Her contribution was no ___ important than his. (= equally important)",["less","more","fewer"]],["g","I was more angry ___ sad.",["than","as","that"]],["g","The ___ you say, the better.",["less","fewer","least"]],["g","It is as much your fault ___ mine.",["as","than","like"]],["g","He's not so much lazy ___ unmotivated.",["as","than","but"]],["c",["She was more surprised than upset.","She was surpriseder than upset.","She was more surprised that upset."],"Comparing two qualities → more + adjective, even for short adjectives."],["e","Learning grammar is no *more* important than learning vocabulary — both matter equally.","Learning grammar is no less important than learning vocabulary — both matter equally.","Equally important → no less … than."]],"s":[["Defend someone or something using no more … than and no less … than.","She's no more to blame than the rest of us. Listening is no less important than speaking."],["Describe your feelings about a recent event using more … than and not so much … as.","I was more relieved than happy. It wasn't so much that I disliked the job as that I needed a change."]]},{"t":"Formal connective and relative structures","c":"I can use whereupon, wherein, insofar as, inasmuch as appropriately.","ex":"Insofar as the data allows, we can conclude …","w":"","r":"Formal connectors: whereupon (= immediately after which), wherein (= in which), whereby (= by which), insofar as / inasmuch as (= to the extent that), hence (+ noun), thereby (+ -ing).","tip":"Students rewrite an informal paragraph using whereupon, thereby and insofar as.","q":[["g","He insulted the referee, ___ he was sent off.",["whereupon","wherein","whereas"]],["g","The contract contains a clause ___ the buyer may cancel within 14 days.",["whereby","whereupon","hence"]],["g","___ the data allows, we can draw some conclusions.",["Insofar as","Whereupon","Hence"]],["g","Sales fell, ___ the need for new marketing.",["hence","thereby","whereupon"],"hence + noun phrase."],["g","They cut costs, ___ saving the company.",["thereby","hence","whereby"],"thereby + -ing."],["c",["The report identifies three areas wherein improvement is needed.","The report identifies three areas wherein it improvement is needed.","The report identifies three areas whereupon improvement is needed."]],["e","The new rules are fair *inasmuch* they treat everyone equally.","The new rules are fair inasmuch as they treat everyone equally.","inasmuch as (two words + as)."],["o","This is the process whereby decisions are made","."]],"s":[["Describe a sequence of events formally using whereupon and thereby.","The CEO announced her resignation, whereupon shares fell sharply, thereby wiping billions off the company's value."],["Express partial agreement formally with insofar as.","I agree with the proposal insofar as it protects small businesses."]]}]},{"n":"Control and style","p":[{"t":"Full register control","c":"I can move fluently between formal, neutral and colloquial grammar.","ex":"Colloquial ellipsis: Sounds good. Want some?","w":"","r":"Match grammar to the situation: formal (passive, nominalisation, inversion, no contractions), neutral, or colloquial (contractions, ellipsis like Sounds good / Want some?, markers like anyway, I mean). The context in brackets decides what is correct.","tip":"Students write the same news three times: a text to a friend, an email to a colleague and a public notice.","q":[["c",["Want some? (offering food to a friend)","Would you be desirous of partaking? (offering food to a friend)","Is it the case that you want some? (offering food to a friend)"]],["c",["Visitors are requested to refrain from smoking. (official sign)","Please don't smoke, OK? Thanks! (official sign)","No smoking, guys! (official sign)"]],["c",["Sounds good — see you then! (text to a colleague you know well)","Your proposal has been received and is deemed acceptable. (text to a colleague you know well)","It sounds well — I will see you then. (text to a colleague you know well)"]],["g","Neutral: I'm afraid I ___ make the meeting tomorrow.",["can't","shall be unable to","ain't gonna"]],["g","Formal: Applicants ___ to submit two references.",["are required","gotta","wanna"]],["g","Colloquial: — Coming tonight? — Yeah, but I'll be a bit ___.",["late","belated","tardy"]],["e","Hey Jo! *Kindly_be_advised* that I'm running late — save me a seat!","Hey Jo! Just so you know, I'm running late — save me a seat!","Formal phrase in a casual message → mismatch."],["o","Please do not hesitate to contact me","."]],"s":[["Say the same thing three ways: you can't come to an event — to a friend, to your boss and in a formal letter.","Can't make it, sorry! / I'm afraid I won't be able to attend. / I regret that I shall be unable to attend."],["Turn this formal notice into casual speech: \"Residents are advised that the lift will be out of service on Monday.\"","Heads up — the lift's not working on Monday."]]},{"t":"Features of spoken grammar","c":"I can use and understand heads, tails, vague language and spoken discourse markers.","ex":"That car of yours — is it still running? It's lovely, that place.","w":"","r":"Speech uses heads (That car of yours — is it still running?), tails (It's lovely, that place.), vague language (and stuff, or something, sort of) and discourse markers (I mean, you know, anyway).","tip":"Students act out a casual conversation, then turn a transcript into written English and compare.","q":[["c",["It's a lovely place, that.","It's a lovely place, this is it.","It's a lovely place, that it."],"Tail: a short pronoun or noun phrase at the end."],["c",["That friend of yours — is she still in Canada?","That friend of yours — she is still in Canada is she?","That friend of you — is she still in Canada?"]],["g","We bought some snacks, drinks ___ stuff.",["and","or so","with"]],["g","It was ___ of strange, to be honest.",["sort","kind to","type"]],["g","Anyway, ___ I was saying, the party was great.",["as","like as","what"]],["g","She's lovely, your sister, ___ she?",["isn't","doesn't","wasn't"]],["g","I mean, it's not that I don't like him — ___ just that he talks a lot.",["it's","is","that's it"]],["e","*Them* shoes of yours — where did you get them?","Those shoes of yours — where did you get them?","Use those, not them, before a noun."]],"s":[["Tell an anecdote in a relaxed, spoken style using a head, a tail and some vague language.","That café near the station — have you been? It's great, that place. They do cakes and coffee and stuff."],["Rewrite this spoken sentence in written style: \"That teacher of ours, she's sort of strict, you know, but fair.\"","Our teacher is quite strict but fair."]]},{"t":"Grammar for tact and persuasion","c":"I can use distancing, impersonal and softening structures to persuade diplomatically.","ex":"It might be worth reconsidering whether …","w":"","r":"Soften requests and criticism with distancing (I was wondering…), impersonal structures (It might be worth…, It has been suggested that…), softer modals (could, might) and negative questions (Wouldn't it be better to…?).","tip":"Students turn blunt feedback into tactful comments on a colleague's presentation.","q":[["g","It might be ___ reconsidering the budget.",["worth","worthy","worthwhile to"]],["g","___ it be better to wait until next week?",["Wouldn't","Won't","Doesn't"]],["g","It ___ been suggested that we start earlier.",["has","is","had to"]],["g","I ___ wondering whether we could move the meeting.",["was","am being","were"]],["g","Perhaps we ___ consider other options.",["could","must to","should to"]],["c",["Wouldn't it make sense to ask the client first?","Doesn't it make sense asking the client first would?","Wouldn't it makes sense to ask the client first?"]],["e","It might be worth *to_check* the dates again.","It might be worth checking the dates again.","worth + -ing."],["o","Would it be possible to extend the deadline","?"]],"s":[["Give tactful feedback on a colleague's report that is too long and has errors.","It might be worth shortening the introduction a little. You might also want to double-check the figures in section 2."],["Persuade your manager, tactfully, to let the team work from home on Fridays.","I was wondering whether it might be worth trying remote Fridays. Wouldn't it help with morale?"]]},{"t":"Self-monitoring and editing for accuracy","c":"I can identify and correct subtle errors in my own speaking and writing.","ex":"","w":"Agreement in long noun phrases; article nuance; collocation.","r":"Check your own speech and writing for subtle errors: agreement in long noun phrases, prepositions after verbs and adjectives, -ing after to as a preposition, tense with for / since, and verb patterns.","tip":"Students swap a paragraph, mark errors with a code (Agr, Prep, T, VP) and then correct their own work.","q":[["e","The number of applicants *have* risen sharply this year.","The number of applicants has risen sharply this year.","The number of … → singular."],["e","I look forward to *hear* from you.","I look forward to hearing from you.","to is a preposition here → -ing."],["e","She is responsible *of* the marketing team.","She is responsible for the marketing team.","responsible for."],["e","Everyone in the meeting *were* surprised by the announcement.","Everyone in the meeting was surprised by the announcement.","everyone → singular verb."],["e","We discussed *about* the new proposal at length.","We discussed the new proposal at length.","discuss takes no preposition."],["e","He has lived in Beijing since *five_years*.","He has lived in Beijing for five years.","A length of time → for."],["c",["She suggested that we leave early.","She suggested us to leave early.","She suggested to leave early us."]],["g","Each of the reports ___ a summary.",["contains","contain","are containing"],"Each of … → singular."],["o","I look forward to hearing from you","."]],"s":[["Speak for one minute about your week. Then listen back (or recall) and correct three of your own mistakes.","\"I have went\" → \"I went\"; \"a lot of informations\" → \"a lot of information\"."],["Proofread aloud and fix: \"The quality of the products have improved and the customers is happier.\"","The quality of the products has improved and the customers are happier."]]},{"t":"Deliberate stylistic choices","c":"I can bend grammatical conventions for effect while knowing the norms.","ex":"Fragments for emphasis: A risk? Certainly. A mistake? Never.","w":"","r":"Skilled writers break rules on purpose: fragments for emphasis (A risk? Certainly.), starting with And / But, deliberate repetition, very short sentences. Use them knowingly and sparingly; the fragmen /* ---------- data prep ---------- */
const P = [];
L.units.forEach((u, ui) => { u.start = P.length + 1; u.p.forEach(p => { p.no = P.length + 1; p.unit = ui; P.push(p); }); u.end = P.length; });
const TOTALQ = P.reduce((a, p) => a + p.q.length, 0);

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.toLowerCase().replace(/[,.!?]/g, "").replace(/\s+/g, " ").trim();
const NOWORD = "(no word)";

function fillGap(text, word) {
  if (word === NOWORD) return text.replace(/ ___/, "").replace(/___ /, "");
  return text.replace("___", word);
}
function prep(raw, point) {
  const q = { t: raw[0], point };
  if (q.t === "g") { q.text = raw[1]; q.answer = raw[2][0]; q.opts = shuffle(raw[2]); q.why = raw[3]; q.full = fillGap(raw[1], raw[2][0]); }
  if (q.t === "c") { q.answer = raw[1][0]; q.opts = shuffle(raw[1]); q.why = raw[2]; q.full = raw[1][0]; }
  if (q.t === "e") {
    q.toks = raw[1].split(" ").map(w => { const m = /^\*(.+)\*([.,!?]?)$/.exec(w); return m ? { w: m[1].replace(/_/g, " ") + m[2], bad: true } : { w: w.replace(/_/g, " "), bad: false }; });
    q.full = raw[2]; q.why = raw[3];
  }
  if (q.t === "o") {
    q.words = raw[1].split(" ").map(w => w.replace(/_/g, " "));
    q.punct = raw[2]; q.why = raw[3];
    q.alts = [q.words.join(" "), ...(raw[4] || [])].map(norm);
    let idx; do { idx = shuffle(q.words.map((_, i) => i)); } while (idx.every((v, i) => v === i) && q.words.length > 1);
    q.bank = idx; q.placed = [];
    q.full = q.words.join(" ") + q.punct;
  }
  return q;
}
const TYPE_LABEL = { g: "Choose the correct word", c: "Which sentence is correct?", e: "Tap the mistake", o: "Put the words in order" };

/* ---------- state ---------- */
const S = { view: "home", round: null, notes: false };
let size = "m";
try { size = localStorage.getItem("lli-qsize") || "m"; } catch (e) {}
function applySize() {
  document.documentElement.dataset.size = size;
  document.getElementById("sizeBtn").textContent = "Text size: " + { m: "M", l: "L", xl: "XL" }[size];
}

function startPoint(no) {
  const p = P[no - 1];
  const items = shuffle(p.q).slice(0, Math.min(6, p.q.length)).map(r => prep(r, p));
  S.round = { mode: "point", point: p, items, i: 0, res: [], speak: null, sprompt: p.s[Math.floor(Math.random() * p.s.length)], showModel: false };
  S.view = "q"; S.notes = false; render(true);
}
function startUnit(ui) {
  const u = L.units[ui];
  const pools = u.p.map(p => ({ p, qs: shuffle(p.q) }));
  const want = Math.min(10, pools.reduce((a, x) => a + x.qs.length, 0));
  const items = [];
  let order = shuffle(pools);
  while (items.length < want) {
    for (const x of order) { if (items.length >= want) break; const r = x.qs.pop(); if (r) items.push(prep(r, x.p)); }
    order = shuffle(order);
  }
  S.round = { mode: "unit", unit: u, ui, items: shuffle(items), i: 0, res: [] };
  S.view = "q"; render(true);
}
function startDiag() {
  const items = P.map(p => prep(p.q[Math.floor(Math.random() * p.q.length)], p));
  S.round = { mode: "diag", items, i: 0, res: [] };
  S.view = "q"; render(true);
}
function again() {
  const r = S.round;
  if (r.mode === "point") startPoint(r.point.no);
  else if (r.mode === "unit") startUnit(r.ui);
  else startDiag();
}

/* ---------- answering ---------- */
function cur() { return S.round.items[S.round.i]; }
function answered() { return S.round.res[S.round.i] !== undefined; }
function choose(k) {
  const q = cur(); if (answered() || !q.opts || !q.opts[k]) return;
  S.round.res[S.round.i] = { ok: q.opts[k] === q.answer, given: q.opts[k] };
  render();
}
function tapWord(k) {
  const q = cur(); if (answered()) return;
  S.round.res[S.round.i] = { ok: q.toks[k].bad, given: q.toks[k].w, pick: k };
  render();
}
function place(k) { const q = cur(); if (answered()) return; q.placed.push(k); render(); }
function unplace(pos) { const q = cur(); if (answered()) return; q.placed.splice(pos, 1); render(); }
function clearOrder() { const q = cur(); if (answered()) return; q.placed = []; render(); }
function checkOrder() {
  const q = cur(); if (answered() || q.placed.length !== q.words.length) return;
  const given = q.placed.map(i => q.words[i]).join(" ");
  S.round.res[S.round.i] = { ok: q.alts.includes(norm(given)), given: given + q.punct };
  render();
}
function next() {
  const r = S.round; if (!answered()) return;
  r.i++;
  if (r.i >= r.items.length) S.view = r.mode === "point" ? "speak" : "results";
  render(true);
}
function rateSpeak(v) { S.round.speak = v; S.view = "results"; render(true); }

/* ---------- render: question ---------- */
function progressHTML() {
  const r = S.round;
  return `<div class="progress" aria-hidden="true">${r.items.map((_, i) => {
    const x = r.res[i]; return `<span class="${x ? (x.ok ? "ok" : "no") : (i === r.i && S.view === "q" ? "cur" : "")}"></span>`; }).join("")}${r.mode === "point" ? `<span class="sp ${S.view === "speak" ? "cur" : (r.speak ? "ok" : "")}"></span>` : ""}</div>`;
}
function crumbsHTML() {
  const r = S.round;
  let title;
  if (r.mode === "point") title = `<small>Session ${pad(r.point.no)}</small>${esc(r.point.t)}`;
  else if (r.mode === "unit") title = `<small>Unit ${r.ui + 1} review</small>${esc(r.unit.n)}`;
  else title = `<small>${esc(L.code)} diagnostic</small>One question per grammar point`;
  const notesBtn = r.mode === "point" && S.view !== "results" ? `<button class="notes-btn" data-act="notes" aria-expanded="${S.notes}">Teacher notes</button>` : "";
  return `<div class="crumbs"><button class="back" data-act="home">← All points</button><div class="crumb-title">${title}</div><div class="grow"></div>${notesBtn}</div>`;
}
function notesHTML() {
  const p = S.round.point;
  return `<dl class="notes">
    <dt>Rule</dt><dd>${esc(p.r)}</dd>
    ${p.ex ? `<dt>Example</dt><dd><i>${esc(p.ex)}</i></dd>` : ""}
    ${p.w ? `<dt>Listen for</dt><dd>${esc(p.w)}</dd>` : ""}
    <dt>Quick fix</dt><dd>${esc(p.tip)}</dd>
  </dl>`;

function questionHTML() {
  const r = S.round, q = cur(), res = r.res[r.i], done = res !== undefined;
  let body = "";
  if (q.t === "g") {
    const gapWord = done ? (res.ok ? q.answer : res.given) : "";
    const gapShow = gapWord === NOWORD ? "—" : gapWord;
    const gap = `<span class="gap ${done ? (res.ok ? "ok" : "no") : ""}">${done ? esc(gapShow) : "&nbsp;"}</span>`;
    body = `<p class="qtext">${esc(q.text).replace("___", gap)}</p>` + optsHTML(q, res, false);
  } else if (q.t === "c") {
    body = optsHTML(q, res, true);
  } else if (q.t === "e") {
    body = `<div class="words">${q.toks.map((t, k) => {
      let cls = ""; if (done) { if (t.bad) cls = "bad"; else if (res.pick === k) cls = "picked"; }
      return `<button class="word ${cls}" data-act="word" data-v="${k}" ${done ? "disabled" : ""}>${esc(t.w)}</button>`; }).join("")}</div>`;
  } else if (q.t === "o") {
    const placedSet = new Set(q.placed);
    body = `<div class="line ${done ? (res.ok ? "done-ok" : "done-no") : ""}" aria-label="Your sentence">
        ${q.placed.length ? q.placed.map((k, pos) => `<button class="tile" data-act="unplace" data-v="${pos}" ${done ? "disabled" : ""}>${esc(q.words[k])}</button>`).join("") : `<span class="placeholder">Tap the words below in the right order.</span>`}
        ${q.placed.length ? `<span class="punct">${esc(q.punct)}</span>` : ""}
      </div>
      ${done ? "" : `<div class="bank">${q.bank.map(k => `<button class="tile ${placedSet.has(k) ? "used" : ""}" data-act="place" data-v="${k}" ${placedSet.has(k) ? 'tabindex="-1" aria-hidden="true"' : ""}>${esc(q.words[k])}</button>`).join("")}</div>
      <div class="order-tools"><button class="btn" data-act="checkorder" ${q.placed.length === q.words.length ? "" : "disabled"}>Check<span class="kbd">Enter</span></button><button class="btn ghost" data-act="clear">Clear</button></div>`}`;
  }
  let fb = "";
  if (done) {
    const why = q.why || q.point.r;
    const from = r.mode !== "point" ? `<p class="from">Session ${pad(q.point.no)} · ${esc(q.point.t)}</p>` : "";
    fb = `<div class="fb ${res.ok ? "ok" : "no"}" role="status">
      <p class="v">${res.ok ? "Correct." : "Not quite."}</p>
      <p class="ans">${esc(q.full)}</p>
      <p class="why">${esc(why)}</p>${from}
    </div>
    <div class="next-row"><button class="btn" data-act="next" id="nextBtn">${r.i + 1 >= r.items.length ? (r.mode === "point" ? "Speaking task" : "See results") : "Next question"}<span class="kbd">Enter</span></button></div>`;
  }
  return `<div class="card">
    <div class="qhead"><span class="qtype">${TYPE_LABEL[q.t]}</span><span class="qnum">Question ${r.i + 1} of ${r.items.length}</span></div>
    ${body}${fb}
  </div>`;
}
function optsHTML(q, res, sent) {
  const done = res !== undefined;
  return `<div class="opts ${sent ? "sent" : ""}">${q.opts.map((o, k) => {
    let cls = ""; if (done) { if (o === q.answer) cls = "right"; else if (o === res.given) cls = "wrong"; }
    return `<button class="opt ${cls}" data-act="opt" data-v="${k}" ${done ? "disabled" : ""}><span class="k">${k + 1}</span><span class="lbl">${esc(o)}</span></button>`; }).join("")}</div>`;
}
function speakHTML() {
  const r = S.round, p = r.point, [prompt, model] = r.sprompt;
  return `<div class="card speak">
    <div class="qhead"><span class="qtype">Speaking task · free use</span><span class="qnum">Last step</span></div>

/* ---------- render: results ---------- */
function suggestion(pct, sp) {
  if (pct >= 0.8 && sp === "yes") return { stage: 2, head: "Ready to confirm Mastered",
    text: "Accurate in this check and correct in free speaking. Tick <b>Mastered</b> once you also see correct use in the student's own speaking or writing on another day." };
  if (pct >= 0.8) return { stage: 1, head: "Practising",
    text: sp === "skip" || !sp ? "Accurate in the practice questions. Run the speaking task next time to check free use before Mastered."
      : "Accurate in the practice questions, but not yet secure in free speaking. Give more speaking and writing practice, then check again." };
  if (pct >= 0.5) return { stage: 1, head: "Practising",
    text: "Some errors. Open <b>Teacher notes</b>, go over the rule, do the quick-fix activity, then run a new round." };
  return { stage: 0, head: "Introduced — reteach",
    text: "Most answers were wrong. Reteach this point with the rule and the quick-fix activity in <b>Teacher notes</b> before practising again." };
}
function reviewList(r) {
  return `<ul class="review">${r.items.map((q, i) => { const x = r.res[i];
    return `<li><span class="mk ${x.ok ? "ok" : "no"}">${x.ok ? "✓" : "✗"}</span><div><div>${esc(q.full)}</div>${x.ok ? "" : `<div class="gv">${q.t === "e" ? "Tapped" : "Answered"}: ${esc(x.given)}</div>`}${r.mode !== "point" ? `<div class="pp">Session ${pad(q.point.no)} · ${esc(q.point.t)}</div>` : ""}</div></li>`; }).join("")}</ul>`;
}
function resultsHTML() {
  const r = S.round, n = r.items.length, ok = r.res.filter(x => x.ok).length, pct = ok / n;
  if (r.mode === "point") {
    const sg = suggestion(pct, r.speak);
    const spText = { yes: "Used it correctly", partly: "Partly", no: "Not yet", skip: "Skipped" }[r.speak] || "Skipped";
    const nextP = r.point.no < P.length ? r.point.no + 1 : null;
    return `<div class="card">
      <div class="score"><span class="big">${ok}<small> / ${n}</small></span><span class="lbl">questions correct · Speaking: <b>${spText}</b></span></div>
      <div class="section-label">Suggested checklist stage</div>
      <div class="stagebar">${["Introduced", "Practising", "Mastered"].map((s, i) => `<div class="${i === sg.stage ? "on" : ""}">${s}<small>${["Taught, needs support", "Guided use, some errors", "Independent, 80%+"][i]}</small></div>`).join("")}</div>
      <p class="advice"><b>${sg.head}.</b> ${sg.text}</p>
      <div class="next-row" style="justify-content:flex-start">
        <button class="btn" data-act="again">New round</button>
        ${nextP ? `<button class="btn ghost" data-act="point" data-v="${nextP}">Next point: ${pad(nextP)} ${esc(P[nextP - 1].t)} →</button>` : ""}
        <button class="btn ghost" data-act="home">All points</button>
      </div>
      <div class="section-label">Answers</div>
      ${reviewList(r)}
    </div>`;
  }
  // unit review & diagnostic
  const byPoint = new Map();
  r.items.forEach((q, i) => { const e = byPoint.get(q.point.no) || { p: q.point, ok: 0, n: 0 }; e.n++; if (r.res[i].ok) e.ok++; byPoint.set(q.point.no, e); });
  const entries = [...byPoint.values()].sort((a, b) => a.p.no - b.p.no);
  const missed = entries.filter(e => e.ok < e.n), got = entries.filter(e => e.ok === e.n);
  const isDiag = r.mode === "diag";
  return `<div class="card">
    <div class="score"><span class="big">${ok}<small> / ${n}</small></span><span class="lbl">${isDiag ? `grammar points answered correctly` : `questions correct across ${entries.length} point${entries.length > 1 ? "s" : ""}`}</span></div>
    ${missed.length ? `<div class="section-label">Run a point check on these</div>
      <div class="miss">${missed.map(e => `<button data-act="point" data-v="${e.p.no}"><span class="n">${pad(e.p.no)}</span><span>${esc(e.p.t)}${e.n > 1 ? ` <span class="gv">(${e.ok} of ${e.n} correct)</span>` : ""}</span><span class="go2">Point check →</span></button>`).join("")}</div>`
      : `<p class="advice"><b>No errors.</b> ${isDiag ? "Use point checks with speaking tasks to confirm Mastered for individual points." : "Run point checks with the speaking task to confirm free use."}</p>`}
    ${got.length ? `<div class="section-label">Correct this time</div><div class="chips">${got.map(e => `<span>${pad(e.p.no)} ${esc(e.p.t)}</span>`).join("")}</div>` : ""}
    <p class="caution">${isDiag ? "One question per point is a screening, not a final judgement. A correct answer can be a lucky guess, and one mistake can be a slip. Confirm with point checks." : "Use this to decide which points need another point check before you move on."}</p>
    <div class="next-row" style="justify-content:flex-start">
      <button class="btn" data-act="again">${isDiag ? "New diagnostic" : "New round"}</button>
      <button class="btn ghost" data-act="home">All points</button>
    </div>
    <div class="section-label">Answers</div>
    ${reviewList(r)}
  </div>`;
}

/* ---------- main render ---------- */
const app = document.getElementById("app");
function render(scrollTop) {
  if (S.view === "home") { app.innerHTML = homeHTML(); }
  else {
    const top = crumbsHTML() + progressHTML() + (S.round.mode === "point" && S.notes && S.view !== "results" ? notesHTML() : "");
    const main = S.view === "q" ? questionHTML() : S.view === "speak" ? speakHTML() : resultsHTML();
    app.innerHTML = `<section class="shell check">${top}${main}</section>`;
  }
  if (scrollTop) window.scrollTo(0, 0);
  const nb = document.getElementById("nextBtn"); if (nb) nb.focus({ preventScroll: true });
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const v = b.dataset.v, act = b.dataset.act;
  switch (act) {
    case "home": S.view = "home"; S.round = null; render(true); break;
    case "point": startPoint(+v); break;
    case "unit": startUnit(+v); break;
    case "diag": startDiag(); break;
    case "again": again(); break;
    case "opt": choose(+v); break;
    case "word": tapWord(+v); break;
    case "place": place(+v); break;
    case "unplace": unplace(+v); break;
    case "clear": clearOrder(); break;
    case "checkorder": checkOrder(); break;
    case "next": next(); break;
    case "notes": S.notes = !S.notes; render(); break;
    case "model": S.round.showModel = true; render(); break;
    case "rate": rateSpeak(v); break;
    case "size": size = { m: "l", l: "xl", xl: "m" }[size]; try { localStorage.setItem("lli-qsize", size); } catch (err) {} applySize(); break;
    case "full": {
      const d = document;
      try { if (d.fullscreenElement) d.exitFullscreen?.(); else d.documentElement.requestFullscreen?.()?.catch?.(() => {}); } catch (err) {}
      break; }
  }
});
document.addEventListener("keydown", e => {
  if (S.view !== "q" || e.altKey || e.ctrlKey || e.metaKey) return;
  const q = cur();
  if (/^[1-9]$/.test(e.key) && q.opts && !answered()) { e.preventDefault(); choose(+e.key - 1); }
  else if (e.key === "Enter") {
    if (e.target.closest && e.target.closest("button")) return; // native button click handles it
    if (answered()) { e.preventDefault(); next(); }
    else if (q.t === "o" && q.placed.length === q.words.length) { e.preventDefault(); checkOrder(); }
  }
});

document.getElementById("lvlChip").textContent = L.code + " Quick Checks";
applySize();
render();
</script>
</body>
</html>
